<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>yawr preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  /* Theme-aware variables. When embedded in a VS Code webview the
     parent applies --vscode-* tokens to <html>; when standalone we
     fall back to GitHub-dark-ish defaults. */
  :root {
    --bg:           var(--vscode-editor-background, #0d1117);
    --bg-alt:       var(--vscode-editorWidget-background, #161b22);
    --fg:           var(--vscode-editor-foreground, #c9d1d9);
    --fg-muted:     var(--vscode-descriptionForeground, #8b949e);
    --border:       var(--vscode-editorWidget-border, #30363d);
    --accent:       var(--vscode-button-background, #238636);
    --accent-hover: var(--vscode-button-hoverBackground, #2ea043);
    --accent-fg:    var(--vscode-button-foreground, #ffffff);
    --danger:       var(--vscode-errorForeground, #da3633);
    --danger-bg:    var(--vscode-inputValidation-errorBackground, #481a1a);
    --danger-border: var(--vscode-inputValidation-errorBorder, #7d2d2d);
    --warn:         var(--vscode-editorWarning-foreground, #d29922);
    --ok:           var(--vscode-charts-green, #2ea043);
    --inspect:      var(--vscode-charts-blue, #58a6ff);
  }
  html, body, #root { margin: 0; height: 100%; width: 100%; font-family: var(--vscode-font-family, -apple-system, system-ui, sans-serif); background: var(--bg); color: var(--fg); }
  #root { display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: var(--bg-alt); border-bottom: 1px solid var(--border); font-size: var(--vscode-font-size, 13px); }
  header input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: inherit; }
  header button { background: var(--accent); border: none; color: var(--accent-fg); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: inherit; }
  header button:hover { background: var(--accent-hover); }
  header button:disabled { background: var(--border); color: var(--fg-muted); cursor: not-allowed; }
  header button.danger { background: var(--danger); }
  header button.toggle { background: transparent; border: 1px solid var(--border); color: var(--fg-muted); padding: 4px 10px; }
  header button.toggle.on { background: var(--bg); color: var(--fg); border-color: var(--accent); }
  header .runID { color: var(--fg-muted); }
  header .conn { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--fg-muted); }
  header .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-muted); }
  header .conn.connected .dot { background: #2ea043; }
  header .conn.connecting .dot { background: #d29922; animation: pulse 1.2s ease-in-out infinite; }
  header .conn.reconnecting .dot { background: #d29922; animation: pulse 1.2s ease-in-out infinite; }
  header .conn.closed .dot { background: var(--fg-muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: row; }
  .graph { flex: 1; min-width: 0; min-height: 0; position: relative; }
  .empty { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--fg-muted); font-size: 14px; }

  .prose { width: 360px; min-width: 280px; max-width: 50%; border-left: 1px solid var(--border); background: var(--bg-alt); overflow: auto; padding: 14px 18px; font-size: 13px; line-height: 1.5; }
  .prose h1 { font-size: 15px; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .prose h2, .prose h3 { font-size: 13px; margin: 14px 0 6px; color: var(--fg-muted); }
  .prose ol, .prose ul { padding-left: 22px; margin: 4px 0; }
  .prose ol ol, .prose ul ul, .prose ol ul, .prose ul ol { padding-left: 18px; }
  .prose li { padding: 2px 4px; border-radius: 4px; margin: 2px -4px; transition: background 120ms; }
  .prose li[data-step-id]:hover { background: rgba(127,127,127,0.08); }
  .prose li.selected { background: rgba(56,139,253,0.16); outline: 1px solid var(--inspect); }
  .prose li.running   > code:first-of-type, .prose li.running   > strong:first-of-type { color: var(--warn); }
  .prose li.completed > code:first-of-type, .prose li.completed > strong:first-of-type { color: var(--ok); }
  .prose li.failed    > code:first-of-type, .prose li.failed    > strong:first-of-type { color: var(--danger); }
  .prose li.skipped   { opacity: 0.6; }
  .prose code { background: rgba(127,127,127,0.12); padding: 1px 4px; border-radius: 3px; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); font-size: 12px; }
  .prose strong { color: var(--fg); }
  .prose em { color: var(--fg-muted); }

  .panel { width: 360px; min-width: 280px; max-width: 50%; border-left: 1px solid var(--border); background: var(--bg-alt); display: flex; flex-direction: column; }
  .panel .panelHeader { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .panel .panelHeader h3 { margin: 0; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .panelHeader .nav { background: transparent; border: 1px solid var(--border); color: var(--fg); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .panel .panelHeader .nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .panel .panelBody { flex: 1; overflow: auto; padding: 12px 14px; font-size: 12px; }
  .panel .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); color: var(--fg-muted); margin-left: 4px; }
  .panel .pill.running   { color: var(--warn);   border-color: var(--warn); }
  .panel .pill.completed { color: var(--ok);     border-color: var(--ok); }
  .panel .pill.failed    { color: var(--danger); border-color: var(--danger); }
  .panel dt { color: var(--fg-muted); margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .panel dd { margin: 2px 0 0; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); word-break: break-word; }
  .panel .interactionInline { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .panel .interactionInline h4 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
  .queryResult { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .queryResult h4 { margin: 0 0 8px; font-size: 13px; color: var(--ok); }
  .queryResult.error h4 { color: var(--danger); }
  .queryMeta { color: var(--fg-muted); margin-bottom: 8px; }
  .queryTableWrap { max-width: 100%; overflow: auto; border: 1px solid var(--border); border-radius: 4px; }
  .queryTable { border-collapse: collapse; width: 100%; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); font-size: 11px; }
  .queryTable th, .queryTable td { border-bottom: 1px solid var(--border); padding: 4px 6px; text-align: left; vertical-align: top; white-space: pre-wrap; }
  .queryTable th { color: var(--fg-muted); background: rgba(127,127,127,0.08); }
  .queryRaw { margin-top: 8px; }
  .queryRaw pre { max-height: 180px; overflow: auto; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 4px; }
  .yawr-code { margin: 10px 0; }
  .yawr-code figcaption { color: var(--fg-muted); font-size: 11px; }
  .yawr-code pre { white-space: pre; overflow: auto; max-height: 360px; }
  .yawr-code button { float: right; }

  .errorBar { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--fg); padding: 10px 14px; border-radius: 6px; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); font-size: 12px; white-space: pre-wrap; z-index: 9; }

  .interaction h3 { margin: 0 0 4px; font-size: 14px; }
  .interaction .step { color: var(--fg-muted); font-size: 12px; margin-bottom: 12px; }
  .interaction label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--fg); }
  .interaction input[type=text], .interaction input[type=number], .interaction input[type=password], .interaction input[type=date], .interaction input[type=datetime-local], .interaction input[type=email], .interaction input[type=url], .interaction textarea, .interaction select { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 13px; margin-bottom: 4px; }
  .interaction button { background: var(--accent); border: none; color: var(--accent-fg); padding: 6px 14px; border-radius: 4px; cursor: pointer; }
  .interaction button:hover { background: var(--accent-hover); }
  .interaction button:disabled { opacity: 0.5; cursor: not-allowed; }
  .interaction .opt { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .interaction .field { margin-bottom: 12px; }
  .interaction .hint { font-size: 11px; color: var(--fg-muted); margin-top: 2px; }
  .interaction .err { font-size: 11px; color: var(--danger-border, #f48771); margin-top: 2px; }
  .interaction .req { color: var(--danger-border, #f48771); margin-left: 2px; }
  .interaction .check { display: flex; gap: 6px; align-items: center; }
  .interaction .check input { width: auto; margin: 0; }
  .debug-breakpoint-marker { color: #f85149; font-size: 11px; line-height: 1; margin-left: auto; }
  .debug-override-marker { color: #d29922; font-size: 9px; font-weight: 700; margin-left: auto; }
  .debug-controls { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .debug-controls h4, .debug-break h4 { margin: 0 0 8px; font-size: 12px; color: var(--fg); }
  .debug-controls label { display: flex; align-items: center; gap: 6px; margin: 6px 0; color: var(--fg); }
  .debug-controls input { margin: 0; }
  .debug-break { margin-top: 2px; }
  .debug-break .breadcrumb { margin-bottom: 10px; color: var(--fg-muted); font-family: var(--vscode-editor-font-family, ui-monospace, monospace); word-break: break-word; }
  .debug-break pre { max-height: 180px; overflow: auto; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 4px; white-space: pre-wrap; word-break: break-word; }
  .debug-break textarea { min-height: 110px; font-family: var(--vscode-editor-font-family, ui-monospace, monospace); }
  .debug-break .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .debug-break button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .debug-break button.danger { background: var(--danger); }
  .debug-audit { margin-top: 12px; padding-top: 10px; border-top: 1px solid #d29922; }
  .debug-audit h4 { margin: 0 0 8px; color: #d29922; font-size: 12px; }
  .debug-audit pre { max-height: 180px; overflow: auto; background: var(--bg); border: 1px solid var(--border); padding: 8px; border-radius: 4px; white-space: pre-wrap; }

  /* =========================================================================
     Multi-Style Visual Stereotypes:
     - Option 3: "smooth-curves" (Modern Bauhaus, Default)
     - Option 1: "minimalist" (Linear / Raycast Dark Minimalist)
     - Option 2: "header-badges" (Vercel / Temporal Workflow Canvas)
     ========================================================================= */

  header select.style-picker {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    outline: none;
  }
  header select.style-picker:hover {
    border-color: var(--accent);
  }

  /* Base Node (Styles: smooth-curves & minimalist) */
  .node {
    box-sizing: border-box;
    position: relative;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    transition: transform 120ms ease;
  }
  .node:hover {
    transform: translateY(-1px);
  }
  .node.selected { filter: drop-shadow(0 0 3px var(--inspect)); }
  .node.pending {
    opacity: 0.9;
  }

  .node-shape-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    z-index: 0;
  }
  .node-shape-svg * {
    vector-effect: non-scaling-stroke;
    fill: #0c1219;
    stroke: #2b3648;
    stroke-width: 1.5;
    transition: stroke 120ms, fill 120ms, stroke-width 120ms;
  }
  .node:hover .node-shape-svg * {
    stroke: var(--accent);
  }
  .node.selected .node-shape-svg * {
    stroke: var(--inspect) !important;
    stroke-width: 2.5 !important;
  }
  .node.running .node-shape-svg * {
    stroke: var(--warn) !important;
    stroke-width: 2 !important;
  }
  .node.delaying .node-shape-svg * {
    stroke: var(--warn) !important;
    stroke-dasharray: 4,3 !important;
    animation: yawr-delay-pulse 1.4s ease-in-out infinite;
  }
  .node.completed .node-shape-svg * {
    stroke: var(--ok) !important;
  }
  .node.failed .node-shape-svg * {
    stroke: var(--danger) !important;
  }
  .react-flow__edge.edge-running .react-flow__edge-path {
    stroke: var(--warn);
    stroke-width: 2.25;
    stroke-dasharray: 5 4;
  }
  .react-flow__edge.edge-completed .react-flow__edge-path {
    stroke: var(--ok);
    stroke-width: 2.25;
  }
  .react-flow__edge.edge-failed .react-flow__edge-path {
    stroke: var(--danger);
    stroke-width: 2.25;
  }
  .branch-merge-node {
    width: 14px;
    height: 14px;
    box-sizing: border-box;
    border: 2px solid var(--fg-muted);
    border-radius: 50%;
    background: var(--bg);
  }

  /* Node content alignment and layout */
  .node-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 6px 14px;
    color: var(--fg);
    font-size: 12px;
    pointer-events: all;
  }
  .node .node-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-bottom: 2px;
  }
  .node .icon-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    flex-shrink: 0;
  }
  .node .kind-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--fg-muted);
    font-weight: 600;
  }
  .node .id {
    font-weight: 600;
    font-size: 12px;
    line-height: 1.25;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.1px;
  }
  .node .title {
    font-size: 10.5px;
    color: var(--fg-muted);
    max-width: 85%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 1px;
  }
  .node .dynamic-subtitle {
    color: var(--fg-muted);
    font-size: 9px;
    margin-top: 2px;
    font-style: italic;
    opacity: 0.85;
  }
  .node .status {
    font-size: 10px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
  }
  .node .status::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  /* --- Option 3: Smooth Curves (Default) --- */
  .node.style-smooth-curves .node-shape-svg * {
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .node.style-smooth-curves.node-cli .node-shape-svg * { fill: #0a0e14; stroke: #33445c; }
  .node.style-smooth-curves.node-cli .node-content { font-family: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, monospace); }
  .node.style-smooth-curves.node-tool .node-shape-svg * { fill: #110e1a; stroke: #413259; }
  .node.style-smooth-curves.node-include .node-shape-svg * { fill: #0a111c; stroke: #2e4566; }
  .node.style-smooth-curves.node-include.dynamic-include .node-shape-svg rect { stroke-dasharray: 4,3; }
  .node.style-smooth-curves.node-decision .node-shape-svg *,
  .node.style-smooth-curves.node-branch .node-shape-svg *,
  .node.style-smooth-curves.node-choice .node-shape-svg * { fill: #160e18; stroke: #4f2e4f; }
  .node.style-smooth-curves.node-decision .node-content,
  .node.style-smooth-curves.node-branch .node-content,
  .node.style-smooth-curves.node-choice .node-content { padding: 10px 24px; }
  .node.style-smooth-curves.node-collector .node-shape-svg * { fill: #09140e; stroke: #2a4c37; }
  .node.style-smooth-curves.node-display .node-shape-svg * { fill: #09121c; stroke: #28445e; }
  .node.style-smooth-curves.node-collector .node-content,
  .node.style-smooth-curves.node-display .node-content { padding: 6px 20px; }
  .node.style-smooth-curves.node-approve .node-shape-svg * { fill: #161009; stroke: #4f3922; }
  .node.style-smooth-curves.node-assert .node-shape-svg * { fill: #09140e; stroke: #2a4c37; }
  .node.style-smooth-curves.node-approve .node-content,
  .node.style-smooth-curves.node-assert .node-content { padding: 6px 22px; }
  .node.style-smooth-curves.node-end .node-shape-svg * { fill: #111417; stroke: #373f47; }
  .node.style-smooth-curves.node-wait_for_event .node-shape-svg * { fill: #141108; stroke: #473e1c; }
  .node.style-smooth-curves.node-compensate .node-shape-svg * { fill: #160c0c; stroke: #542222; stroke-dasharray: 4,2; }
  .node.style-smooth-curves.node-iterate .node-shape-svg * { fill: #141108; stroke: #473e1c; }
  .node.style-smooth-curves.node-parallel .node-shape-svg * { fill: #0a111c; stroke: #2e4566; }
  .node.style-smooth-curves.node-noop .node-shape-svg * { stroke: var(--border); fill: transparent; stroke-dasharray: 3,3; }
  .node.style-smooth-curves.node-noop { opacity: 0.65; }
  .node.style-smooth-curves.node-extension .node-shape-svg * { fill: #110e1a; stroke: #413259; stroke-dasharray: 4,3; }

  /* --- Option 1: Linear / Raycast Minimalist --- */
  .node.style-minimalist .kind-label { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 3px; padding: 1px 5px; }
  .node.style-minimalist.node-cli .node-shape-svg * { fill: #0b0e14; stroke: #2e3846; }
  .node.style-minimalist.node-cli .node-shape-svg line { stroke: #388bfd; stroke-width: 3; }
  .node.style-minimalist.node-cli .node-content { font-family: var(--vscode-editor-font-family, ui-monospace, monospace); }
  .node.style-minimalist.node-tool .node-shape-svg * { fill: #111019; stroke: #2f2a40; }
  .node.style-minimalist.node-tool .node-shape-svg line { stroke: #8957e5; stroke-width: 1.5; }
  .node.style-minimalist.node-include .node-shape-svg * { fill: #0c121e; stroke: #253347; }
  .node.style-minimalist.node-include .node-shape-svg line { stroke: #388bfd; stroke-width: 1.5; }
  .node.style-minimalist.node-include.dynamic-include .node-shape-svg rect { stroke: #388bfd; stroke-dasharray: 4,3; }
  .node.style-minimalist.node-decision .node-shape-svg *,
  .node.style-minimalist.node-branch .node-shape-svg *,
  .node.style-minimalist.node-choice .node-shape-svg * { fill: #141018; stroke: #3d2a3d; }
  .node.style-minimalist.node-decision .node-content,
  .node.style-minimalist.node-branch .node-content,
  .node.style-minimalist.node-choice .node-content { padding: 7px 22px; }
  .node.style-minimalist.node-collector .node-shape-svg * { fill: #0a130e; stroke: #213829; }
  .node.style-minimalist.node-display .node-shape-svg * { fill: #0b121b; stroke: #203348; }
  .node.style-minimalist.node-collector .node-content,
  .node.style-minimalist.node-display .node-content { padding: 6px 18px; }
  .node.style-minimalist.node-approve .node-shape-svg * { fill: #16110a; stroke: #3d2e1b; }
  .node.style-minimalist.node-assert .node-shape-svg * { fill: #0a130e; stroke: #213829; }
  .node.style-minimalist.node-approve .node-content,
  .node.style-minimalist.node-assert .node-content { padding: 6px 18px; }
  .node.style-minimalist.node-end .node-shape-svg * { fill: #121518; stroke: #2c3239; }
  .node.style-minimalist.node-wait_for_event .node-shape-svg * { fill: #14120a; stroke: #36301a; }
  .node.style-minimalist.node-compensate .node-shape-svg * { fill: #160c0c; stroke: #421c1c; stroke-dasharray: 4,2; }
  .node.style-minimalist.node-iterate .node-shape-svg * { fill: #14120a; stroke: #36301a; }
  .node.style-minimalist.node-parallel .node-shape-svg * { fill: #0c121e; stroke: #253347; }
  .node.style-minimalist.node-noop .node-shape-svg * { stroke: var(--border); fill: transparent; stroke-dasharray: 3,3; }
  .node.style-minimalist.node-noop { opacity: 0.65; }
  .node.style-minimalist.node-extension .node-shape-svg * { fill: #111019; stroke: #2f2a40; stroke-dasharray: 4,3; }

  /* --- Option 2: Vercel / Temporal Workflow Cards --- */
  .node-v2 {
    width: 196px;
    box-sizing: border-box;
    position: relative;
    cursor: pointer;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .node-v2:hover {
    transform: translateY(-1px);
    border-color: var(--accent);

<body>
<div id="root"></div>

<script type="module">
import { React, useEffect, useMemo, useState, useCallback, useRef, createRoot, ReactFlow,
  Background, Controls, MiniMap, Handle, Position, ReactFlowProvider, useReactFlow, dagre, marked, DOMPurify } from '/preview/assets/vendor/preview.js';
import { mountCode, mountAuthoredExpressions, highlightFences, decodeEnvelope, safeOutputs, validateDocumentPresentation } from '/preview/assets/highlighting/highlighter.js';

const e = React.createElement;

// Preview refresh policy: live runs may revalidate documents at most once
// every 3000ms, never concurrently, and never automatically after a
// terminal state, except for one final retained-presentation snapshot.
// Operators can still click Load for a deliberate refresh.
const PREVIEW_DOC_POLL_INTERVAL_MS = 3000;
// Query result samples are intentionally bounded in both rows and rendered
// text to keep served previews responsive for large query outputs.
const QUERY_RESULT_SAMPLE_ROWS = 10;
const QUERY_RESULT_CELL_CHAR_LIMIT = 120;
const QUERY_RESULT_TOTAL_CHAR_BUDGET = 12000;
const QUERY_RESULT_UI_TEXT_RESERVE = 5120;
const QUERY_RESULT_DIAGNOSTIC_CHAR_BUDGET = 4096;
const TERMINAL_RUN_STATUSES = new Set(['completed', 'failed', 'cancelled']);
const isTerminalRunStatus = (status) => TERMINAL_RUN_STATUSES.has(status);

function edgeRuntimeClass(nodeState) {
  if (!nodeState) return '';
  if (nodeState.status === 'running' || nodeState.status === 'delaying') return 'edge-running';
  if (nodeState.status === 'completed') return 'edge-completed';
  if (nodeState.status === 'failed' || nodeState.status === 'cancelled') return 'edge-failed';
  return '';
}

function branchArmRouteMatches(edge, state) {
  if (edge.runtimeArmIndex === undefined || edge.runtimeArmIndex === null) return true;
  const output = (state && state.output) || {};
  if (output.matched_arm_index !== undefined && output.matched_arm_index !== null) {
    return Number(output.matched_arm_index) === Number(edge.runtimeArmIndex);
  }
  if (edge.runtimeArmLabel && output.matched_arm !== undefined) {
    return output.matched_arm === edge.runtimeArmLabel;
  }
  return null;
}

function edgeRuntimeState(edge, overlayNodes) {
  const state = overlayNodes[edge.runtimeNodeID || edge.target];
  if (!state) return null;
  if (edge.runtimeExpectedStatus && state.status !== edge.runtimeExpectedStatus) {
    if (edge.routeKind !== 'arm-entry' || !['running', 'failed'].includes(state.status)) return null;
  }
  const armMatch = branchArmRouteMatches(edge, state);
  if (armMatch === false) return null;
  if (armMatch === null) {
    const fallbackState = overlayNodes[edge.runtimeFallbackNodeID];
    if (!fallbackState || fallbackState.status === 'pending' || fallbackState.status === 'skipped') return null;
    return fallbackState;
  }
  if (edge.routeKind === 'no-match' && state.status === 'skipped') return { ...state, status: 'completed' };
  return state;
}

function visibleSelectedNodeID(selectedNode, selectionIsExplicit, runID, overlay, pending) {
  if (!selectedNode) return null;
  if (selectionIsExplicit || !runID || (pending && (pending.nodeID || pending.stepID) === selectedNode)) return selectedNode;
  const nodeState = overlay && overlay.nodes ? overlay.nodes[selectedNode] : null;
  if (!nodeState || nodeState.status === 'pending' || nodeState.status === 'skipped') return null;
  return selectedNode;
}

function debugCallPathForNode(doc, nodeID) {
  if (!doc || !nodeID) return [];
  const direct = (doc.nodes || []).find(node => node.id === nodeID);
  if (direct && direct.data && Array.isArray(direct.data.call_path)) {
    return direct.data.call_path.map(stepID => ({ step_id: stepID }));
  }
  const nodes = doc.nodes || [];
  const nodeByID = new Map(nodes.map(node => [node.id, node]));
  const groupByID = new Map((doc.groups || []).map(group => [group.id, group]));
  const frameByID = new Map((doc.frames || []).map(frame => [frame.id, frame]));
  const ancestors = [];
  const seen = new Set([nodeID]);
  let current = nodeByID.get(nodeID);
  while (current) {
    const data = current.data || current;
    const group = data.group_id ? groupByID.get(data.group_id) : null;
    const frame = data.frame_id ? frameByID.get(data.frame_id) : null;
    const parentID = (group && group.parent_node_id) || (frame && frame.parent_include_node_id) || '';
    if (!parentID || seen.has(parentID)) break;
    seen.add(parentID);
    ancestors.push({ step_id: parentID });
    current = nodeByID.get(parentID);
  }
  return ancestors.reverse();
}

function debugTargetSupported(doc, nodeID) {
  if (!doc || !nodeID) return false;
  const nodes = doc.nodes || [];
  const nodeByID = new Map(nodes.map(node => [node.id, node]));
  const groupByID = new Map((doc.groups || []).map(group => [group.id, group]));
  const kindOf = node => node && node.data && node.data.kind || node && node.kind || '';
  const target = nodeByID.get(nodeID);
  if (!target || ['parallel', 'compensate', 'wait_for_event'].includes(kindOf(target))) return false;
  let groupID = target.data && target.data.group_id || target.group_id || '';
  while (groupID) {
    const group = groupByID.get(groupID);
    if (!group) break;
    const parent = nodeByID.get(group.parent_node_id);
    if (!parent) break;
    if (['parallel', 'compensate'].includes(kindOf(parent))) return false;
    if (kindOf(parent) === 'iterate' && parent.data && parent.data.concurrent) return false;
    groupID = parent.data && parent.data.group_id || parent.group_id || '';
  }
  return true;
}

function toggleDebugBreakpoint(breakpoints, doc, nodeID, phase) {
  if (!debugTargetSupported(doc, nodeID)) return breakpoints || [];
  const callPath = debugCallPathForNode(doc, nodeID);
  const node = (doc && doc.nodes || []).find(candidate => candidate.id === nodeID);
  const stepID = node && node.data && node.data.step_id || nodeID;
  const samePath = candidate => JSON.stringify(candidate || []) === JSON.stringify(callPath);
  const exists = (breakpoints || []).some(item => item.step === stepID && item.phase === phase && samePath(item.callPath));
  if (exists) {
    return breakpoints.filter(item => !(item.step === stepID && item.phase === phase && samePath(item.callPath)));
  }
  return (breakpoints || []).concat([{ step: stepID, phase, callPath, nodeID }]);
}

function buildDebugRunConfig(breakpoints, profile, allowStaleProfile, watches) {
  const config = {
    enabled: true,
    breakpoints: (breakpoints || []).map(item => ({
      step: item.step,
      phase: item.phase,
      callPath: (item.callPath || []).map(frame => ({ ...frame })),
    })),
  };
  if (profile) config.profile = profile;
  if (allowStaleProfile) config.allowStaleProfile = true;
  if (watches && watches.length > 0) config.watches = watches.slice();
  return config;
}

function shouldStartDebugRun(breakpoints, selectedProfileID) {
  return (breakpoints || []).length > 0 || !!selectedProfileID;
}

function parseDebugWatches(text) {
  return String(text || '').split(/\r?\n/).map(item => item.trim()).filter(Boolean);
}

function debugProfileID(name) {
  return String(name || '').trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 64);
}

function withBranchMerges(doc) {
  if (!doc || doc.branchMergesApplied) return doc;
  const originalNodes = [...(doc.nodes || [])];
  const originalEdges = (doc.edges || []).map(edge => ({ ...edge }));
  const groups = (doc && doc.groups) || [];
  const nodeByID = new Map(originalNodes.map(node => [node.id, node]));
  const armGroupsByBranch = new Map();
  const childGroupsByParent = new Map();
  for (const group of groups) {
    if (!group.parent_node_id) continue;
    if (!childGroupsByParent.has(group.parent_node_id)) childGroupsByParent.set(group.parent_node_id, []);
    childGroupsByParent.get(group.parent_node_id).push(group);
    if (group.kind === 'branch-arm') {
      if (!armGroupsByBranch.has(group.parent_node_id)) armGroupsByBranch.set(group.parent_node_id, []);
      armGroupsByBranch.get(group.parent_node_id).push(group);
    }
  }
  if (armGroupsByBranch.size === 0) return doc;
  const nodeKind = node => (node && node.data && node.data.kind) || (node && node.kind) || '';
  const nodeOrder = node => Number((node && node.data && node.data.order) ?? (node && node.order) ?? 0);
  const nodeGroupID = node => (node && node.data && node.data.group_id) || (node && node.group_id) || '';
  const nodeFrameID = node => (node && node.data && node.data.frame_id) || (node && node.frame_id) || '';
  const nodesByGroup = new Map();
  const scopeNodes = new Map();
  for (const node of originalNodes) {
    const groupID = nodeGroupID(node);
    if (groupID) {
      if (!nodesByGroup.has(groupID)) nodesByGroup.set(groupID, []);
      nodesByGroup.get(groupID).push(node);
    }
    const key = nodeFrameID(node) + '\u0000' + nodeGroupID(node);
    if (!scopeNodes.has(key)) scopeNodes.set(key, []);
    scopeNodes.get(key).push(node);
  }
  for (const members of nodesByGroup.values()) members.sort((left, right) => nodeOrder(left) - nodeOrder(right));
  for (const members of scopeNodes.values()) members.sort((left, right) => nodeOrder(left) - nodeOrder(right));
  const directNodes = group => nodesByGroup.get(group.id) || [];

  const pruned = new Set();
  const markSubtree = nodeID => {
    if (!nodeID || pruned.has(nodeID)) return;
    pruned.add(nodeID);
    for (const group of childGroupsByParent.get(nodeID) || []) {
      for (const child of directNodes(group)) markSubtree(child.id);
    }
  };
  const markFollowingSiblings = branchID => {
    const branch = nodeByID.get(branchID);
    if (!branch) return;
    const key = nodeFrameID(branch) + '\u0000' + nodeGroupID(branch);
    const members = scopeNodes.get(key) || [];
    const index = members.findIndex(node => node.id === branchID);
    for (const sibling of members.slice(index + 1)) markSubtree(sibling.id);
  };

  const branchMemo = new Map();
  const analyzeNode = (node, visiting) => {
    if (!node || nodeKind(node) === 'end') return [];
    if (nodeKind(node) === 'branch') return analyzeBranch(node.id, visiting);
    return [{ sourceID: node.id, runtimeNodeID: node.id }];
  };
  const analyzeSequence = (members, visiting) => {
    if (members.length === 0) return [];
    for (let index = 0; index < members.length; index++) {
      const exits = analyzeNode(members[index], visiting);
      if (index === members.length - 1) return exits;
      if (exits.length === 0) {
        for (const unreachable of members.slice(index + 1)) markSubtree(unreachable.id);
        return [];
      }
    }
    return [];
  };
  const armRouteLabel = arm => {
    if (arm.fallback) return arm.label ? 'Otherwise — ' + arm.label : 'Otherwise';
    return arm.label || 'Empty matched arm';
  };
  const armIndex = arm => Number(arm.index ?? 0);
  const armRuntimeLabel = (branchID, arm) => {
    const label = arm.label || '';
    if (!label) return '';
    const duplicates = (armGroupsByBranch.get(branchID) || []).filter(candidate => candidate.label === label);
    return duplicates.length === 1 ? label : '';
  };
  for (const [branchID, arms] of armGroupsByBranch) {
    for (const arm of arms) {
      const members = directNodes(arm);
      if (members.length === 0) continue;
      const entry = originalEdges.find(edge => edge.source === branchID && edge.target === members[0].id && edge.type === 'branch-arm');
      if (!entry) continue;
      entry.routeKind = 'arm-entry';
      entry.runtimeNodeID = branchID;
      entry.runtimeExpectedStatus = 'completed';
      entry.runtimeArmIndex = armIndex(arm);
      entry.runtimeArmLabel = armRuntimeLabel(branchID, arm);
      entry.runtimeFallbackNodeID = members[0].id;
    }
  }
  function analyzeBranch(branchID, visiting = new Set()) {
    if (branchMemo.has(branchID)) return branchMemo.get(branchID);
    if (visiting.has(branchID)) return [{ sourceID: branchID, runtimeNodeID: branchID }];
    const nextVisiting = new Set(visiting);
    nextVisiting.add(branchID);
    const arms = armGroupsByBranch.get(branchID) || [];
    const exits = [];
    for (const arm of arms) {
      const members = directNodes(arm);
      if (members.length === 0) {
        exits.push({
          sourceID: branchID,
          label: armRouteLabel(arm),
          routeKind: 'empty-arm',
          runtimeNodeID: branchID,
          runtimeExpectedStatus: 'completed',
          runtimeArmIndex: armIndex(arm),
          runtimeArmLabel: armRuntimeLabel(branchID, arm),
        });
        continue;
      }
      exits.push(...analyzeSequence(members, nextVisiting).map(exit => ({
        ...exit,
        routeKind: 'arm-exit',
        runtimeNodeID: branchID,
        runtimeExpectedStatus: 'completed',
        runtimeArmIndex: armIndex(arm),
        runtimeArmLabel: armRuntimeLabel(branchID, arm),
        runtimeFallbackNodeID: exit.sourceID,
      })));
    }
    if (!arms.some(arm => arm.fallback)) {
      exits.push({
        sourceID: branchID,
        label: 'No matching arm',
        routeKind: 'no-match',
        runtimeNodeID: branchID,
        runtimeExpectedStatus: 'skipped',
      });
    }
    branchMemo.set(branchID, exits);
    return exits;
  }

  for (const branchID of armGroupsByBranch.keys()) analyzeBranch(branchID);
  for (const branchID of armGroupsByBranch.keys()) {
    const hasContinuation = originalEdges.some(edge => edge.source === branchID && edge.type === 'sequence');
    if (hasContinuation && (branchMemo.get(branchID) || []).length === 0) markFollowingSiblings(branchID);
  }

  const nodes = originalNodes.filter(node => !pruned.has(node.id));
  let edges = originalEdges.filter(edge => !pruned.has(edge.source) && !pruned.has(edge.target));
  const usedIDs = new Set(nodes.map(node => node.id));
  const allocateMergeID = branchID => {
    let candidate = '__yawr_preview_merge__:' + branchID;
    let suffix = 1;
    while (usedIDs.has(candidate)) candidate = '__yawr_preview_merge__:' + branchID + ':' + suffix++;
    usedIDs.add(candidate);
    return candidate;
  };

  for (const [branchID, arms] of armGroupsByBranch) {
    const continuationIndex = edges.findIndex(edge => edge.source === branchID && edge.type === 'sequence');
    if (continuationIndex < 0) continue;
    const continuation = edges[continuationIndex];
    edges.splice(continuationIndex, 1);
    const uniqueExits = [];
    const seenExits = new Set();
    for (const exit of branchMemo.get(branchID) || []) {
      if (pruned.has(exit.sourceID)) continue;
      const key = [exit.sourceID, exit.label || '', exit.routeKind || '', exit.runtimeArmIndex ?? ''].join('\u0000');
      if (seenExits.has(key)) continue;
      seenExits.add(key);
      uniqueExits.push(exit);
    }
    if (uniqueExits.length === 0) continue;

    const branchNode = nodeByID.get(branchID);
    const continuationNode = nodeByID.get(continuation.target);
    const mergeID = allocateMergeID(branchID);
    const mergeNode = {
      id: mergeID,
      kind: 'merge',
      data: {
        id: mergeID,
        kind: 'merge',
        title: 'Branch merge',
        group_id: (branchNode && branchNode.data && branchNode.data.group_id) || '',
        frame_id: (branchNode && branchNode.data && branchNode.data.frame_id) || '',
        order: nodeOrder(continuationNode) - 0.5,
        synthetic: true,
        merge_for: branchID,
      },
    };
    nodes.push(mergeNode);
    nodeByID.set(mergeID, mergeNode);
    for (const exit of uniqueExits) {
      edges.push({
        source: exit.sourceID,
        target: mergeID,
        type: 'branch-merge',
        label: exit.label || '',
        routeKind: exit.routeKind || '',
        runtimeNodeID: exit.runtimeNodeID || exit.sourceID,
        runtimeExpectedStatus: exit.runtimeExpectedStatus || '',
        runtimeArmIndex: exit.runtimeArmIndex,
        runtimeArmLabel: exit.runtimeArmLabel || '',
        runtimeFallbackNodeID: exit.runtimeFallbackNodeID || '',
      });
    }
    edges.push({ ...continuation, source: mergeID, runtimeNodeID: continuation.target });
  }
  return { ...doc, nodes, edges, branchMergesApplied: true };
}

function graphEdgeID(edge) {
  const routeSuffix = edge.routeKind
    ? ':' + edge.routeKind + ':' + (edge.runtimeArmIndex ?? '')
    : '';
  return edge.source + '->' + edge.target + (edge.label ? ':' + edge.label : '') + routeSuffix;
}

function trimVisibleGraph(allNodes, allEdges, overlayNodes) {
  const nodeByID = new Map(allNodes.map(node => [node.id, node]));
  const out = new Map();
  const inDegree = new Map();
  for (const node of allNodes) { out.set(node.id, []); inDegree.set(node.id, 0); }
  for (const edge of allEdges) {
    if (!out.has(edge.source) || !out.has(edge.target)) continue;
    out.get(edge.source).push(edge);
    inDegree.set(edge.target, (inDegree.get(edge.target) || 0) + 1);
  }
  const stateIsExecuted = state => !!state && state.status !== 'pending' && state.status !== 'skipped';
  const routeIsActive = edge => {
    const state = overlayNodes[edge.runtimeNodeID || edge.source];
    if (!state) return false;
    if (edge.runtimeExpectedStatus && state.status !== edge.runtimeExpectedStatus) {
      if (edge.routeKind !== 'arm-entry' || !['running', 'failed'].includes(state.status)) return false;
    }
    const armMatch = branchArmRouteMatches(edge, state);
    if (armMatch !== null) return armMatch;
    return stateIsExecuted(overlayNodes[edge.runtimeFallbackNodeID]);
  };
  const liveMemo = new Map();
  const visiting = new Set();
  const isLive = id => {
    if (liveMemo.has(id)) return liveMemo.get(id);
    if (visiting.has(id)) return false;
    visiting.add(id);
    let live = stateIsExecuted(overlayNodes[id]) || (out.get(id) || []).some(edge => edge.routeKind && routeIsActive(edge));
    if (!live) {
      for (const edge of out.get(id) || []) {
        if (edge.kind === 'branch-merge' || edge.type === 'branch-merge') continue;
        if (isLive(edge.target)) { live = true; break; }
      }
    }
    visiting.delete(id);
    liveMemo.set(id, live);
    return live;
  };
  const kindOf = id => {
    const node = nodeByID.get(id);
    return node ? ((node.data && node.data.kind) || node.kind || '') : '';
  };
  const edgeIsActive = edge => {
    if (edge.kind === 'branch-merge' || edge.type === 'branch-merge') {
      if (edge.routeKind) return routeIsActive(edge);
      return stateIsExecuted(overlayNodes[edge.runtimeNodeID || edge.source]);
    }
    if (kindOf(edge.source) === 'branch' && overlayNodes[edge.source]) return isLive(edge.target);
    return true;
  };
  const nodeIDs = new Set();
  const edgeIDs = new Set();
  const queue = [];
  let cursor = 0;
  for (const node of allNodes) {
    if ((inDegree.get(node.id) || 0) === 0) { nodeIDs.add(node.id); queue.push(node.id); }
  }
  while (cursor < queue.length) {
    const current = queue[cursor++];
    for (const edge of out.get(current) || []) {
      if (!edgeIsActive(edge)) continue;
      edgeIDs.add(graphEdgeID(edge));
      if (nodeIDs.has(edge.target)) continue;
      nodeIDs.add(edge.target);
      queue.push(edge.target);
    }
  }
  return { nodeIDs, edgeIDs };
}

// ---------- layout ----------
const NODE_W = 190;
const NODE_H = 66;

function getNodeDimensions(kind, nodeStyle = 'smooth-curves') {
  if (kind === 'merge') return { width: 14, height: 14 };
  if (nodeStyle === 'header-badges') {
    switch (kind) {
      case 'end': return { width: 180, height: 56 };
      case 'noop': return { width: 160, height: 50 };
      default: return { width: 196, height: 72 };
    }
  }
  if (nodeStyle === 'minimalist') {
    switch (kind) {
      case 'decision':
      case 'branch':
      case 'choice':
        return { width: 195, height: 68 };
      case 'collector':
      case 'display':
        return { width: 190, height: 66 };
      case 'approve':
      case 'assert':
        return { width: 195, height: 68 };
      case 'end':
        return { width: 170, height: 48 };
      case 'noop':
        return { width: 150, height: 44 };
      default:
        return { width: 190, height: 66 };
    }
  }
  // Default: 'smooth-curves' (Option 3)
  switch (kind) {
    case 'decision':
    case 'branch':
    case 'choice':
      return { width: 210, height: 82 }; // Smooth Diamond
    case 'collector':
    case 'display':
      return { width: 195, height: 68 }; // Smooth Parallelogram
    case 'approve':
    case 'assert':
      return { width: 195, height: 68 }; // Smooth Hexagon
    case 'end':
      return { width: 175, height: 50 }; // Stadium Pill
    case 'noop':
      return { width: 155, height: 46 }; // Minimal Pill
    default:
      return { width: 190, height: 66 }; // Process / Subroutine
  }
}

function layoutDocument(doc, nodeStyle = 'smooth-curves') {
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'TB', nodesep: 34, ranksep: 64 });
  g.setDefaultEdgeLabel(() => ({}));
  for (const n of doc.nodes) {
    const dim = getNodeDimensions(n.kind, nodeStyle);
    g.setNode(n.id, { width: dim.width, height: dim.height });
  }
  for (const ed of doc.edges) g.setEdge(ed.source, ed.target);
  dagre.layout(g);

  const stepNodes = doc.nodes.map(n => {
    const pos = g.node(n.id);
    const kind = (n.data && n.data.kind) || n.kind || '';
    const dim = getNodeDimensions(kind === 'merge' ? kind : n.kind, nodeStyle);
    const node = {
      id: n.id,
      type: kind === 'merge' ? 'branchMerge' : 'yawrStep',
      position: { x: (pos?.x ?? 0) - dim.width / 2, y: (pos?.y ?? 0) - dim.height / 2 },
      // Steps must stack above frames regardless of frame depth.
      style: { width: dim.width, height: dim.height, zIndex: 1000 },
      data: { ...(n.data || { id: n.id, kind: n.kind }), nodeStyle },
    };
    if (kind === 'merge') {
      node.selectable = false;
      node.draggable = false;
      node.focusable = false;
    }
    return node;
  });

  // Compute group bounding boxes from member nodes (transitively, via
  // group_id chains in doc.groups). Render each group as a back-layer
  // synthetic node so React Flow draws it behind the steps. zIndex
  // decreases with nesting depth so deeper groups overlay shallower ones.
  const frameNodes = computeFrameNodes(doc, g);

  // Compute kit-declared region overlays (see specs/regions-v1.md).
  // Regions are sibling to frames but sit one z-layer below them so
  // structural frames remain visible inside a region.
  const regionNodes = computeRegionNodes(doc, g);

  const edges = doc.edges.map(ed => ({
    id: graphEdgeID(ed),
    source: ed.source, target: ed.target, label: ed.label,
    kind: ed.type,
    routeKind: ed.routeKind,
    runtimeNodeID: ed.runtimeNodeID,
    runtimeExpectedStatus: ed.runtimeExpectedStatus,
    runtimeArmIndex: ed.runtimeArmIndex,
    runtimeArmLabel: ed.runtimeArmLabel,
    runtimeFallbackNodeID: ed.runtimeFallbackNodeID,
  }));
  // Regions first, then frames, then steps — React Flow stacks in
  // array order so the last item paints on top.
  return { nodes: [...regionNodes, ...frameNodes, ...stepNodes], edges };
}

// computeFrameNodes builds back-layer "frame" nodes for every group that
// has at least one member node positioned by dagre. Group depth is the
// length of its parent-group chain; deeper groups render on top so a
// nested include-frame appears inside its enclosing frame.
function computeFrameNodes(doc, dagreGraph) {
  if (!doc.groups || doc.groups.length === 0) return [];

  const nodeByID = new Map();
  for (const n of doc.nodes) nodeByID.set(n.id, n);

  // group.id -> parent group.id ('' when this group sits at the top
  // of its frame). A group is anchored to a parent node; that node may
  // itself live inside another group, which is the parent of this one.
  const parentOfGroup = new Map();
  for (const g of doc.groups) {
    const parentNode = g.parent_node_id ? nodeByID.get(g.parent_node_id) : null;
    const parentGID = (parentNode && parentNode.data && parentNode.data.group_id) || '';
    parentOfGroup.set(g.id, parentGID);
  }

  // Each node is a member of every ancestor group, walking up from its
  // innermost group via parentOfGroup. This is what makes outer frames
  // enclose the union of all descendant nodes (and therefore visually
  // contain every nested frame).
  const memberByGroup = new Map();
  for (const n of doc.nodes) {
    let cur = (n.data && n.data.group_id) || '';
    while (cur) {
      if (!memberByGroup.has(cur)) memberByGroup.set(cur, []);
      memberByGroup.get(cur).push(n.id);
      cur = parentOfGroup.get(cur) || '';
    }
  }

  function depthOf(gid) {
    let d = 0;
    let cur = parentOfGroup.get(gid) || '';
    while (cur) { d++; cur = parentOfGroup.get(cur) || ''; }
    return d;
  }

  // Maximum nesting depth among all groups; outer frames need more
  // padding than inner ones so they fully enclose the inner frame
  // (including the inner frame's own padding).
  let maxDepth = 0;
  for (const grp of doc.groups) {
    const d = depthOf(grp.id);
    if (d > maxDepth) maxDepth = d;
  }

  const frames = [];
  for (const grp of doc.groups) {
    const memberIDs = memberByGroup.get(grp.id);
    if (!memberIDs || memberIDs.length === 0) continue;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const id of memberIDs) {
      const p = dagreGraph.node(id);
      if (!p) continue;
      const pw = p.width || NODE_W;
      const ph = p.height || NODE_H;
      const x = p.x - pw / 2, y = p.y - ph / 2;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x + pw > maxX) maxX = x + pw;
      if (y + ph > maxY) maxY = y + ph;
    }
    if (!isFinite(minX)) continue;
    const depth = depthOf(grp.id);
    // Padding scales with the inverse-depth so outer frames pad further
    // out than the inner frames they enclose. Without this, every frame
    // that transitively contains the same leaf node ends at the same
    // bottom Y and the nested groups all share one bottom edge.
    const inv = (maxDepth - depth);
    const PAD_X = 16 + inv * 10;
    const PAD_TOP = 22 + inv * 10;
    const PAD_BOTTOM = 22 + inv * 10;
    const w = (maxX - minX) + PAD_X * 2;
    const h = (maxY - minY) + PAD_TOP + PAD_BOTTOM;
    frames.push({
      id: 'frame:' + grp.id,
      type: 'frameBox',
      position: { x: minX - PAD_X, y: minY - PAD_TOP },
      // className lands on the React Flow wrapper as an extra class so
      // our .react-flow__node-frameBox.<kind> CSS rules can colour it.
      className: grp.kind || '',
      // Explicit width/height drive the wrapper's box-model directly.
      // Deeper groups (higher depth) sit on top so inner frames are
      // visible against their enclosing outer frames.
      style: { width: w, height: h, zIndex: depth },
      data: { kind: grp.kind, label: frameLabel(grp), depth },
      selectable: false,
      draggable: false,
      focusable: false,
    });
  }
  return frames;
}

function frameLabel(grp) {
  if (grp.kind === 'branch-arm' && grp.fallback) {
    return grp.label ? 'Otherwise — ' + grp.label : 'Otherwise';
  }
  if (grp.label) return grp.label;
  switch (grp.kind) {
    case 'include-frame':   return 'include';
    case 'iterate-body':    return 'iterate';
    case 'parallel-branch': return 'parallel';
    case 'branch-arm':      return 'branch';
    case 'compensate-body': return 'compensate';
    default:                return grp.kind || '';
  }
}

function FrameBox({ data }) {
  // Visuals come from .react-flow__node-frameBox CSS; this just adds
  // the kind class onto the wrapper via React Flow's className prop
  // (we also set className on the node object below so it lands on
  // the wrapper element directly), and renders the label.
  return data.label
    ? e('div', { className: 'frame-label' }, data.label)
    : null;
}

function BranchMergeNode() {
  return e('div', { className: 'branch-merge-node', title: 'Branch merge' },
    e(Handle, { type: 'target', position: Position.Top }),
    e(Handle, { type: 'source', position: Position.Bottom }),
  );
}

// computeRegionNodes builds back-layer "region" nodes for every entry
// in doc.regions.regions. Each region's box encloses the bounding box
// of its member step nodes (after dagre layout). Regions are drawn
// below structural frames so iterate/branch frames remain visible
// inside a region.
function computeRegionNodes(doc, dagreGraph) {
  if (!doc.regions || !doc.regions.regions || doc.regions.regions.length === 0) return [];
  const result = [];
  for (const r of doc.regions.regions) {
    const members = r.members || [];
    if (members.length === 0) continue;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    let placed = 0;
    for (const id of members) {
      const p = dagreGraph.node(id);
      if (!p) continue;
      placed++;
      const pw = p.width || NODE_W;
      const ph = p.height || NODE_H;
      const x = p.x - pw / 2, y = p.y - ph / 2;
      if (x < minX) minX = x;
      if (y < minY) minY = y;
      if (x + pw > maxX) maxX = x + pw;
      if (y + ph > maxY) maxY = y + ph;
    }
    if (placed === 0 || !isFinite(minX)) continue;
    const PAD_X = 32;
    const PAD_TOP = 32;
    const PAD_BOTTOM = 26;
    const w = (maxX - minX) + PAD_X * 2;
    const h = (maxY - minY) + PAD_TOP + PAD_BOTTOM;
    // Slug op_type to a CSS-safe class fragment (op-ops-change-request).
    const opClass = 'op-' + (r.op_type || '').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    result.push({
      id: 'region:' + r.id,
      type: 'regionBox',
      position: { x: minX - PAD_X, y: minY - PAD_TOP },
      className: opClass,
      // zIndex below frames (frames use zIndex = depth, max ~maxDepth).
      // Use a fixed negative-ish value to stay under all frames.
      style: { width: w, height: h, zIndex: -1 },
      data: { label: r.label || r.id, opType: r.op_type, kit: r.kit },
      selectable: false,
      draggable: false,
      focusable: false,
    });
  }
  return result;
}

function RegionBox({ data }) {
  // Visuals come from .react-flow__node-regionBox CSS; this just renders
  // the floating label that identifies the kit-declared op.
  return e('div', { className: 'region-label' },
    data.opType ? e('span', { className: 'op' }, data.opType) : null,
    data.label || '',
  );
}

function StepNode({ data }) {
