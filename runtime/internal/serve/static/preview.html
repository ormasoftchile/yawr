// GraphCanvas wraps ReactFlow so it can use useReactFlow() to drive the
// viewport. It auto-pans to the selected node whenever selection
// changes; if the user pans manually (mouse drag, wheel zoom), we
// surface that via onUserPan so App can stop following execution.
function GraphCanvas({ runID, nodes, edges, selectedNode, onUserPan, onNodeClick }) {
  const userMoved = useRef(false);
  const wrapRef = useRef(null);
  const rf = useReactFlow();

  // New run: forget that the user moved the viewport, so we re-fit
  // until they touch it again. We deliberately key on runID, NOT
  // doc.hash — the run-document re-fetches on every frontier
  // expansion and its hash changes, which would otherwise wipe the
  // user's intent each time an include opens. Reset only on a real
  // run-identity change.
  useEffect(() => {
    userMoved.current = false;
  }, [runID]);

  // Detect real user gestures from raw DOM events on the wrapper. We
  // use capture-phase native listeners so ReactFlow can't swallow
  // them via stopPropagation, and we only look at events that fitView
  // / setViewport never synthesize: wheel, mousedown on the pane
  // background (=pan), touchstart on the pane (=pan/pinch). We
  // deliberately do NOT mark on every mousedown — that would fire on
  // node clicks and disable autofit just because the user clicked a
  // step. Wheel anywhere is fine; only nodes scroll-trap, not the
  // canvas itself, and the user wheel-zooming is unambiguous intent.
  // (ReactFlow's own onMoveStart fires for both programmatic and
  // user-driven moves, and any flag-based disambiguation races
  // fitView's async dispatch — that's why earlier attempts froze.)
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const mark = () => {
      if (userMoved.current) return;
      userMoved.current = true;
      if (onUserPan) onUserPan();
    };
    const markIfPane = (ev) => {
      // Pan only starts on the pane background or the viewport itself,
      // not on a node, edge, or control button.
      const t = ev.target;
      if (!(t instanceof Element)) return;
      if (t.closest('.react-flow__node, .react-flow__edge, .react-flow__controls, .react-flow__minimap')) return;
      mark();
    };
    el.addEventListener('wheel', mark, { capture: true, passive: true });
    el.addEventListener('mousedown', markIfPane, { capture: true });
    el.addEventListener('touchstart', markIfPane, { capture: true, passive: true });
    return () => {
      el.removeEventListener('wheel', mark, { capture: true });
      el.removeEventListener('mousedown', markIfPane, { capture: true });
      el.removeEventListener('touchstart', markIfPane, { capture: true });
    };
  }, [onUserPan]);

  // Auto-fit while the user hasn't manually panned/zoomed. Re-runs on:
  //   1. First non-empty render (doc load).
  //   2. Mid-run frontier expansion (include opens, new nodes appear)
  //      — without this the user sees a near-empty canvas because the
  //      old viewport is now zoomed onto a tiny region of the graph.
  // Once the user pans or zooms, userMoved sticks and we stop
  // refitting; the pending-input badge is the explicit way to jump.
  const stepIDsKey = nodes
    ? nodes.filter(n => n.type === 'yawrStep').map(n => n.id).sort().join('|')
    : '';
  useEffect(() => {
    if (userMoved.current) return;
    if (!rf || !rf.fitView) return;
    if (!stepIDsKey) return;
    // Defer two frames so React Flow has measured the new nodes; a
    // single-frame defer sometimes fits to a stale layout when many
    // nodes appear at once (frontier expansion).
    let cancelled = false;
    const raf1 = requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if (cancelled || userMoved.current) return;
        try { rf.fitView({ padding: 0.15 }); } catch { }
      });
    });
    return () => { cancelled = true; cancelAnimationFrame(raf1); };
  }, [stepIDsKey, rf]);

  // Pan to the selected step at the user's current zoom whenever it
  // changes. This keeps the active leaf in view even after the user
  // has zoomed in, which userMoved would otherwise prevent. We pan
  // (setCenter at the current zoom), never re-zoom, so the user's
  // zoom level is preserved. selectedNode changes from both
  // execution progress (auto-tracker advancing the running leaf) and
  // direct clicks; in both cases panning to the chosen node is what
  // the user wants. Skipped while autofit is still in charge —
  // fitView already shows everything, and panning during the same
  // frame would fight it.
  //
  // We also re-run when `nodes` changes: the auto-tracker can advance
  // selectedNode the moment a new state event arrives, before the
  // run-document re-fetch has populated the corresponding ReactFlow
  // node. Without the nodes dependency the pan would silently no-op
  // (rf.getNode returns null) and the new active step stays
  // off-screen until the user pans manually.
  useEffect(() => {
    if (!userMoved.current) return;
    if (!selectedNode) return;
    if (!rf || !rf.setCenter || !rf.getNode || !rf.getViewport) return;
    let cancelled = false;
    // The node may not be measured yet on the first frame after a
    // frontier expansion. Try a few frames before giving up.
    let attempts = 0;
    const tryPan = () => {
      if (cancelled) return;
      const n = rf.getNode(selectedNode);
      let w = n && n.width || 0;
      let h = n && n.height || 0;
      if (n && (!w || !h)) {
        const el = document.querySelector('.react-flow__node[data-id="' + CSS.escape(selectedNode) + '"]');
        if (el) { const r = el.getBoundingClientRect(); w = r.width; h = r.height; }
      }
      if (!n || !n.position || !w || !h) {
        if (++attempts < 8) requestAnimationFrame(tryPan);
        return;
      }
      const cx = n.position.x + w / 2;
      const cy = n.position.y + h / 2;
      const { zoom } = rf.getViewport();
      try { rf.setCenter(cx, cy, { zoom, duration: 250 }); } catch { }
    };
    requestAnimationFrame(tryPan);
    return () => { cancelled = true; };
  }, [selectedNode, nodes, rf]);

  return e('div', { ref: wrapRef, style: { width: '100%', height: '100%' } },
    e(ReactFlow, {
      nodes, edges, nodeTypes,
      onNodeClick,
    },
      e(Background, null),
      e(Controls, null),
      e(MiniMap, null),
    ),
  );
}

// InputsForm renders the declaration-driven input experience (AR-CE-3,
// F-4): a closed <select> in declared order for each non-redacted enum
// input, free text for everything else (unconstrained or
// enumRedacted:true), and no auto-selection beyond a declared default
// that is itself a member (AR-CE-6 §2). It is the primary input surface
// once the graphjson DTO carries `inputs[]`; the raw-JSON box above it
// remains the fallback (AR-CE-3 §3.6) and, whenever non-empty, wins
// outright over this form (see App.startRun) -- so this form disables
// itself (visually only; it never blocks the JSON box) while that box
// holds text, to avoid two silently-conflicting sources of inputs.
function InputsForm({ decls, values, setValue, disabled }) {
  if (!decls || decls.length === 0) return null;
  return e('div', { className: 'inputsForm', style: { padding: '6px 12px', borderBottom: '1px solid var(--border)', opacity: disabled ? 0.5 : 1 } },
    decls.map(d => {
      const id = 'input-' + d.name;
      const v = values[d.name] ?? '';
      let control;
      if (d.enumRedacted) {
        // C1: free text only. No member is ever rendered, logged, or
        // autocompleted. enumMemberCount MAY be shown as a hint.
        control = e('input', {
          id, type: 'text', value: v, disabled,
          onChange: ev => setValue(d.name, ev.target.value),
          placeholder: d.enumMemberCount ? `one of ${d.enumMemberCount} permitted values` : 'value',
        });
      } else if (d.enum && d.enum.length > 0) {
        // Closed selector, declared order, no sort/dedupe/case-fold.
        // The placeholder option's value is "" -- which buildFormInputs
        // treats as "unset" (never submitted), and which can never
        // collide with a real member (ENUM-003: "" is never a legal
        // enum member).
        control = e('select', { id, value: v, disabled, onChange: ev => setValue(d.name, ev.target.value) },
          e('option', { value: '' }, d.required ? '\u2014 select \u2014' : '\u2014 unset \u2014'),
          d.enum.map((m, i) => e('option', { key: i + ':' + m, value: m }, m)),
        );
      } else {
        // Unconstrained string: mandatory free text, verbatim.
        control = e('input', {
          id, type: 'text', value: v, disabled,
          onChange: ev => setValue(d.name, ev.target.value),
        });
      }
      return e('div', { key: d.name, style: { display: 'inline-flex', alignItems: 'center', gap: 4, marginRight: 14 } },
        e('label', { htmlFor: id, style: { fontSize: 12 } }, d.name + (d.required ? ' *' : '') + ':'),
        control,
      );
    }),
  );
}

// Cache the entire checkpoint overlay with its validator, never just graph.hash.
async function fetchPreviewDocument(identity, url, cache, signal) {
  if (cache.identity !== identity) {
    cache.identity = identity;
    cache.etag = '';
    cache.document = null;
  }
  const headers = cache.etag && cache.document ? { 'If-None-Match': cache.etag } : {};
  const res = await fetch(url, { signal, headers });
  if (signal.aborted || cache.identity !== identity) return null;
  if (res.status === 304) {
    if (!cache.document) throw new Error('Document validator returned 304 without a matching document');
    return cache.document;
  }
  if (!res.ok) throw new Error(await res.text());
  const document = validateDocumentPresentation(await res.json());
  if (signal.aborted || cache.identity !== identity) return null;
  cache.document = document;
  cache.etag = res.headers.get('ETag') || '';
  return document;
}

// ---------- main app ----------
function App() {
  const params = new URLSearchParams(location.search);
  const [runbookPath, setRunbookPath] = useState(params.get('runbookPath') || '');
  const [inputsJSON, setInputsJSON] = useState(params.get('inputs') || '');
  const initialStyle = params.get('style') || localStorage.getItem('yawr_preview_style') || 'smooth-curves';
  const [nodeStyle, setNodeStyle] = useState(initialStyle);
  const updateStyle = useCallback((newStyle) => {
    setNodeStyle(newStyle);
    try { localStorage.setItem('yawr_preview_style', newStyle); } catch {}
  }, []);
  // formValues holds the declared-input form state (AR-CE-3 §6, F-4):
  // one entry per doc.inputs[].name. A value of "" means "nothing
  // selected/entered" and is never itself submitted -- it is the
  // "unset" affordance, distinct from an operator-typed empty string,
  // because the wire never carries the key at all in that case (see
  // buildFormInputs). The raw-JSON box above remains the fallback
  // surface (AR-CE-3 §3.6): whenever it is non-empty it wins outright,
  // exactly as before this form existed.
  const [formValues, setFormValues] = useState({});
  const [doc, setDoc] = useState(null);
  const [error, setError] = useState('');
  const initialRunID = params.get('runID') || '';
  const [runID, setRunID] = useState(initialRunID);
  const activeRunIDRef = useRef(initialRunID);
  const [isStarting, setIsStarting] = useState(false);
  const [stateOverlay, setStateOverlay] = useState(null);
  const [pending, setPending] = useState(null);
  const [selectedNode, setSelectedNode] = useState(null);
  const [userSelected, setUserSelected] = useState(false); // sticky once user picks
  const [selectionIsExplicit, setSelectionIsExplicit] = useState(false);
  const [connStatus, setConnStatus] = useState('idle'); // idle|connecting|connected|reconnecting|closed
  const [showProse, setShowProse] = useState(true);
  const [showPanel, setShowPanel] = useState(true);
  const [trim, setTrim] = useState(false);
  const [breakpoints, setBreakpoints] = useState([]);
  const [isDebugRun, setIsDebugRun] = useState(false);
  const [debugProfiles, setDebugProfiles] = useState([]);
  const [selectedDebugProfileID, setSelectedDebugProfileID] = useState('');
  const [watchesText, setWatchesText] = useState('');
  const runStatus = stateOverlay && stateOverlay.status;
  const isTerminal = isTerminalRunStatus(runStatus);
  const profileRunbookPath = doc && doc.runbook && doc.runbook.path ? doc.runbook.path : runbookPath;
  const isTerminalRef = useRef(false);
  const docFetchInFlightRef = useRef(false);
  const docAbortRef = useRef(null);
  const runDocETagRef = useRef('');
  const docCacheRef = useRef({ identity: '', etag: '', document: null });
  const docFinalRefreshRef = useRef(false);
  const frontierRefreshKeyRef = useRef('');
  // This identity changes on every page reload. A late host reply from a
  // destroyed preview instance can therefore never acknowledge a new one.
  const hostActionSessionRef = useRef(newPreviewSessionID());
  const hostActionRequestsRef = useRef(new Map());

  useEffect(() => { isTerminalRef.current = isTerminal; }, [isTerminal]);

  const loadDoc = useCallback(async (opts = {}) => {
    const manual = !!opts.manual;
    setError('');
    if (!runbookPath && !runID) return;
    if (!manual && isTerminalRef.current) return;
    if (docFetchInFlightRef.current) {
      if (opts.final) docFinalRefreshRef.current = true;
      return;
    }
    const controller = new AbortController();
    docFetchInFlightRef.current = true;
    docAbortRef.current = controller;
    try {
      // While a run is active, fetch the run-scoped document so the
      // server can frontier-expand only the includes the runtime has
      // actually entered. Design-time previews stay fully lazy.
      const url = runID
        ? '/runs/' + encodeURIComponent(runID) + '/document'
        : '/preview/document?runbookPath=' + encodeURIComponent(runbookPath);
      const identity = JSON.stringify([url, runbookPath]);
      const document = await fetchPreviewDocument(identity, url, docCacheRef.current, controller.signal);
      if (!document || controller.signal.aborted) return;
      runDocETagRef.current = docCacheRef.current.etag;
      setDoc(document);
    } catch (err) {
      if (controller.signal.aborted || (err && err.name === 'AbortError')) return;
      setError(String(err));
      setDoc(null);
    } finally {
      if (docAbortRef.current === controller) {
        docAbortRef.current = null;
        docFetchInFlightRef.current = false;
        if (docFinalRefreshRef.current) {
          docFinalRefreshRef.current = false;
          loadDoc({ manual: true });
        }
      }
    }
  }, [runbookPath, runID]);

  useEffect(() => {
    runDocETagRef.current = '';
    docCacheRef.current = { identity: '', etag: '', document: null };
    docFinalRefreshRef.current = false;
    setDoc(null);
    setSelectedNode(null);
    frontierRefreshKeyRef.current = '';
    if (docAbortRef.current) {
      docAbortRef.current.abort();
      docAbortRef.current = null;
      docFetchInFlightRef.current = false;
    }
    loadDoc({ manual: true });
    return () => {
      if (docAbortRef.current) {
        docAbortRef.current.abort();
        docAbortRef.current = null;
        docFetchInFlightRef.current = false;
      }
    };
  }, [runbookPath, runID, loadDoc]);

  useEffect(() => {
    if (!runID || isTerminal) return;
    const timer = setInterval(() => loadDoc(), PREVIEW_DOC_POLL_INTERVAL_MS);
    return () => clearInterval(timer);
  }, [runID, isTerminal, loadDoc]);
  useEffect(() => {
    if (runID && isTerminal) loadDoc({ manual: true, final: true });
  }, [runID, isTerminal, loadDoc]);

  useEffect(() => {
    if (!doc || !profileRunbookPath) {
      setDebugProfiles([]);
      setSelectedDebugProfileID('');
      return;
    }
    const controller = new AbortController();
    fetch('/debug-profiles?runbookPath=' + encodeURIComponent(profileRunbookPath), { signal: controller.signal })
      .then(async response => {
        if (!response.ok) throw new Error(await response.text());
        return response.json();
      })
      .then(result => {
        const profiles = Array.isArray(result.profiles) ? result.profiles : [];
        setDebugProfiles(profiles);
        setSelectedDebugProfileID(current => profiles.some(item => item.id === current) ? current : '');
      })
      .catch(error => {
        if (error && error.name === 'AbortError') return;
        setDebugProfiles([]);
      });
    return () => controller.abort();
  }, [profileRunbookPath, doc && doc.hash]);

  const refreshForUnknownIDs = useCallback((ids) => {
    if (!runID || isTerminal || !doc || !ids.length) return;
    const known = new Set(doc.nodes ? doc.nodes.map(n => n.id) : []);
    const missing = ids.filter(id => id && !known.has(id)).sort();
    if (!missing.length) return;
    const key = (doc.hash || '') + ':' + missing.join('|');
    if (frontierRefreshKeyRef.current === key) return;
    frontierRefreshKeyRef.current = key;
    loadDoc();
  }, [runID, isTerminal, doc, loadDoc]);

  // When state arrives mentioning a step that isn't in the current
  // graph, the runtime has just entered a previously-opaque include.
  // Refetch once per unchanged document/missing-ID set; never spin after
  // a terminal state whose final overlay references an absent node.
  useEffect(() => {
    if (!stateOverlay || !stateOverlay.nodes) return;
    refreshForUnknownIDs(Object.keys(stateOverlay.nodes));
  }, [stateOverlay, refreshForUnknownIDs]);

  // Same trigger for pending: an awaiting-input frame for an unknown
  // step ID means the engine just entered an include the renderer has
  // not yet expanded. Pending arrives on a separate SSE from state and
  // typically fires first, so without this the UI looks stuck.
  useEffect(() => {
    if (!pending || !pending.stepID) return;
    refreshForUnknownIDs([pending.stepID]);
  }, [pending, refreshForUnknownIDs]);

  const acknowledgeHostAction = useCallback(async (data) => {
    const current = pending;
    const request = current && current.host_action;
    if (!current || current.kind !== 'host_action' || !request) return;
    const correlationID = current.correlationID || current.turnID;
    const requestID = hostActionRequestsRef.current.get(correlationID);
    if (!requestID ||
        data.runId !== runID ||
        data.turnId !== current.turnID ||
        data.correlationId !== correlationID ||
        data.previewSessionId !== hostActionSessionRef.current ||
        data.requestId !== requestID ||
        data.capability !== request.capability ||
        !['completed', 'failed', 'timed-out', 'unsupported', 'execution-not-started'].includes(data.status)) {
      return;
    }
    const res = await fetch('/runs/' + encodeURIComponent(runID) + '/interactions/' + encodeURIComponent(current.turnID), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Yawr-Ack-Source': 'preview',
      },
      body: JSON.stringify({
        kind: 'host_action',
        runID,
        turnID: current.turnID,
        correlationID,
        capability: request.capability,
        status: data.status,
        result: data.result,
      }),
    });
    if (!res.ok) {
      throw new Error(await res.text() || ('HTTP ' + res.status));
    }
    hostActionRequestsRef.current.delete(correlationID);
    setPending(p => (p && p.turnID === current.turnID) ? null : p);
    // Notify the parent wrapper that the broker POST completed so tests
    // can synchronise on the canonical ack delivery before exiting.
    if (window.parent !== window) {
      const targetOrigin = previewParentTargetOrigin();
      if (targetOrigin) {
        window.parent.postMessage({
          type: 'yawr.host-action.ack-delivered',
          turnId: current.turnID,
          correlationId: correlationID,
        }, targetOrigin);
      }
    }
  }, [pending, runID]);

  const acknowledgeHostActionCancellation = useCallback((data) => {
    const current = pending;
    const request = current && current.host_action;
    if (!current || current.kind !== 'host_action' || !request) return Promise.resolve();
    const correlationID = current.correlationID || current.turnID;
    const requestID = hostActionRequestsRef.current.get(correlationID);
    if (!requestID ||
        data.correlationId !== correlationID ||
        data.previewSessionId !== hostActionSessionRef.current ||
        data.requestId !== requestID ||
        data.status !== 'execution-not-started' ||
        !['panel-disposed', 'run-replaced', 'reload'].includes(data.reason)) {
      return Promise.resolve();
    }
    return acknowledgeHostAction({
      runId: runID,
      turnId: current.turnID,
      correlationId: correlationID,
      previewSessionId: hostActionSessionRef.current,
      requestId: requestID,
      capability: request.capability,
      status: 'execution-not-started',
    });
  }, [pending, runID, acknowledgeHostAction]);

  // Listen for messages from the host (e.g. VS Code extension forwarding
  // configuration changes), including scoped host-action acknowledgements.
  useEffect(() => {
    const onMsg = (ev) => {
      const expectedOrigin = previewParentTargetOrigin();
      if (!expectedOrigin || ev.source !== window.parent || ev.origin !== expectedOrigin) return;
      const data = ev && ev.data;
      if (data && data.type === 'reload') loadDoc({ manual: true });
      if (data && data.type === 'setStyle' && data.style) updateStyle(data.style);
      if (data && (data.type === 'yawr.host-action.ack' || data.type === 'yawr.host-action.cancel')) {
        const settle = data.type === 'yawr.host-action.ack'
          ? acknowledgeHostAction(data)
          : acknowledgeHostActionCancellation(data);
        settle.catch(err => setError(String(err)));
      }
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [loadDoc, updateStyle, acknowledgeHostAction, acknowledgeHostActionCancellation]);

  // Re-initialise the declared-input form whenever a new document loads.
  // Preselection rule (AR-CE-6 §2): a decl's default preselects only when
  // it is present; for enum decls the engine (ENUM-006) already
  // guarantees a declared default is a member, so the client is never
  // asked to repair a non-member default here. No other implicit
  // selection: a required decl with no default starts genuinely empty.
  useEffect(() => {
    const decls = (doc && doc.inputs) || [];
    const next = {};
    for (const d of decls) {
      next[d.name] = (d.default !== undefined && d.default !== null) ? String(d.default) : '';
    }
    setFormValues(next);
  }, [doc && doc.hash]);

  // buildFormInputs turns the declared-input form state into the {name:
  // value} object POSTed to /runs. A field left at "" (nothing
  // selected/typed) is omitted entirely -- the "unset" affordance is
  // "key absent", never a submitted empty string (AR-CE-3 §6.1, CE-R-03).
  // Every other value is forwarded byte-verbatim: no trim, no case-fold,
  // no NFC normalisation (AR-CE-5 §1-2).
  const buildFormInputs = useCallback(() => {
    const decls = (doc && doc.inputs) || [];
    const out = {};
    for (const d of decls) {
      const v = formValues[d.name];
      if (v === undefined || v === '') continue;
      out[d.name] = v;
    }
    return out;
  }, [doc, formValues]);

  const saveDebugProfile = useCallback(async ({ name, target, set }) => {
    const id = debugProfileID(name);
    if (!id) throw new Error('Enter a profile name containing letters or numbers.');
    const response = await fetch('/debug-profiles/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        runbookPath: profileRunbookPath,
        profile: { name, overrides: [{ target, set }] },
      }),
    });
    if (!response.ok) throw new Error(await response.text());
    const saved = await response.json();
    setDebugProfiles(current => current.filter(item => item.id !== saved.id).concat([saved])
      .sort((left, right) => left.name.localeCompare(right.name)));
    setSelectedDebugProfileID(saved.id);
    return saved;
  }, [profileRunbookPath]);

  const startRun = useCallback(async (debug = false) => {
    if (!runbookPath || isStarting) return;
    const selectedProfile = debugProfiles.find(item => item.id === selectedDebugProfileID);
    if (debug && breakpoints.length === 0 && !selectedProfile) {
      setError('Add a breakpoint or select a debug profile before starting a debug run.');
      return;
    }
    if (debug && selectedProfile && selectedProfile.stale &&
        !window.confirm('This debug profile was created for an older runbook plan. Run it anyway?')) return;
    setError('');
    let inputs = undefined;
    if (inputsJSON.trim() !== '') {
      // Raw-JSON box wins outright when non-empty -- it is the
      // fallback surface (AR-CE-3 §3.6), and its presence signals the
      // operator chose it over the declared-input form.
      try { inputs = JSON.parse(inputsJSON); }
      catch (err) { setError('inputs must be valid JSON: ' + err.message); return; }
    } else {
      const formInputs = buildFormInputs();
      if (Object.keys(formInputs).length > 0) inputs = formInputs;
    }
    setIsStarting(true);
    activeRunIDRef.current = '';
    setRunID('');
    setStateOverlay(null);
    setPending(null);
    setConnStatus('idle');
    setUserSelected(false);
    setSelectionIsExplicit(false);
    setSelectedNode(null);
    setIsDebugRun(debug);
    try {
      const request = { runbookPath, inputs, actor: 'web-ui' };
      if (debug) request.debug = buildDebugRunConfig(
        breakpoints,
        selectedProfile && selectedProfile.profile,
        !!(selectedProfile && selectedProfile.stale),
        parseDebugWatches(watchesText),
      );
      const res = await fetch('/runs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(request),
      });
      if (!res.ok) throw new Error(await res.text());
      const j = await res.json();
      activeRunIDRef.current = j.runID;
      setRunID(j.runID);
    } catch (err) {
      setError(String(err));
    } finally {
      setIsStarting(false);
    }
  }, [runbookPath, inputsJSON, buildFormInputs, isStarting, breakpoints, debugProfiles, selectedDebugProfileID, watchesText]);

  // /runs/{id}/state SSE
  useEffect(() => {
    if (!runID || isTerminal) return;
    setConnStatus('connecting');
    const streamRunID = runID;
    const es = new EventSource('/runs/' + encodeURIComponent(streamRunID) + '/state');
    // Server emits named "state" events, not the default "message".
    const onState = (ev) => {
      if (activeRunIDRef.current !== streamRunID) return;
      try { setStateOverlay(JSON.parse(ev.data)); } catch {}
    };
    es.addEventListener('state', onState);
    es.onmessage = onState; // tolerate untyped frames too
    es.onopen = () => {
      if (activeRunIDRef.current !== streamRunID) return;
      setConnStatus('connected');
    };
    es.onerror = () => {
      if (activeRunIDRef.current !== streamRunID) return;
      // EventSource auto-reconnects unless readyState is CLOSED.
      setConnStatus(es.readyState === 2 /* CLOSED */ ? 'closed' : 'reconnecting');
    };
    return () => {
      es.removeEventListener('state', onState);
      es.close();
      setConnStatus('idle');
    };
  }, [runID, isTerminal]);

  // Forward a pending typed host action only to an explicitly identified
  // parent. A standalone or untrusted embedding reports that execution did not start;
  // it never attempts to emulate host work or sends a wildcard-origin message.
  useEffect(() => {
    if (!pending || pending.kind !== 'host_action' || !pending.host_action) return;
    const correlationID = pending.correlationID || pending.turnID;
    if (!correlationID || hostActionRequestsRef.current.has(correlationID)) return;
    const requestID = hostActionSessionRef.current + ':' + correlationID;
    hostActionRequestsRef.current.set(correlationID, requestID);
    const targetOrigin = previewParentTargetOrigin();
    if (window.parent === window || !targetOrigin) {
      acknowledgeHostAction({
        runId: runID,
        turnId: pending.turnID,
        correlationId: correlationID,
        previewSessionId: hostActionSessionRef.current,
        requestId: requestID,
        capability: pending.host_action.capability,
        status: 'execution-not-started',
      }).catch(err => setError(String(err)));
      return;
    }
    window.parent.postMessage({
      type: 'yawr.host-action.request',
      version: 'yawr.host-action/v1',
      capability: pending.host_action.capability,
      runId: runID,
      turnId: pending.turnID,
      correlationId: correlationID,
      previewSessionId: hostActionSessionRef.current,
      requestId: requestID,
      request: pending.host_action.request,
    }, targetOrigin);
  }, [pending, runID, acknowledgeHostAction]);

  useEffect(() => () => {
    const targetOrigin = previewParentTargetOrigin();
    const hadPendingHostAction = hostActionRequestsRef.current.size > 0;
    for (const [correlationID, requestID] of hostActionRequestsRef.current) {
      if (targetOrigin && window.parent !== window) {
        window.parent.postMessage({
          type: 'yawr.host-action.cancel',
          version: 'yawr.host-action/v1',
          correlationId: correlationID,
          previewSessionId: hostActionSessionRef.current,
          requestId: requestID,
          status: 'execution-not-started',
          reason: 'run-replaced',
        }, targetOrigin);
      }
    }
    hostActionRequestsRef.current.clear();
    // Closing or reloading a preview while its host action is pending is a
    // lifecycle cancellation of the run, not an invented host result.
    if (runID && hadPendingHostAction) {
      fetch('/runs/' + encodeURIComponent(runID), { method: 'DELETE', keepalive: true }).catch(() => {});
    }
  }, [runID]);

  // /runs/{id}/interactions SSE
  useEffect(() => {
    if (!runID || isTerminal) return;
    const streamRunID = runID;
    const es = new EventSource('/runs/' + encodeURIComponent(streamRunID) + '/interactions');
    es.onmessage = (ev) => {
      if (activeRunIDRef.current !== streamRunID) return;
      try {
        const f = JSON.parse(ev.data);
        if (f.type === 'pending') {
          setPending(f);
          // Auto-focus the step that's asking for input.
          if (f.stepID) {
            setSelectionIsExplicit(false);
            setSelectedNode(f.nodeID || f.stepID);
            setUserSelected(false); // still allow auto-track to take over after resolution
          }
        }
        else if (f.type === 'resolved') setPending(p => (p && p.turnID === f.turnID ? null : p));
      } catch {}
    };
    return () => es.close();
  }, [runID, isTerminal]);

  const submitAnswer = useCallback(async (env) => {
    if (!pending) return;
    const submittedTurnID = pending.turnID;
    const res = await fetch('/runs/' + encodeURIComponent(runID) + '/interactions/' + encodeURIComponent(pending.turnID), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(env),
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || ('HTTP ' + res.status));
    }
    // Don't blindly null pending — the resolved+next-pending pair often
    // arrives over SSE before this POST response, so a naive
    // setPending(null) clobbers a freshly-delivered next turn. Only
    // clear if the visible pending is still the one we just answered.
    setPending(p => (p && p.turnID === submittedTurnID) ? null : p);
  }, [runID, pending]);

  const cancelRun = useCallback(async () => {
    if (!runID) return;
    try {
      await fetch('/runs/' + encodeURIComponent(runID), { method: 'DELETE' });
    } catch (err) { setError(String(err)); }
  }, [runID]);

  const onNodeClick = useCallback((_ev, node) => {
    if (!node || (node.data && node.data.synthetic)) return;
    setUserSelected(true);
    setSelectionIsExplicit(true);
    setSelectedNode(node.id || null);
  }, []);

  // Auto-track the step the user is most likely watching, in priority
  // order:
  //   1. The most recently-started leaf that is currently `running`
  //      (or `delaying`, since that becomes a leaf in flight) —
  //      whatever the user is waiting on right now.
  //   2. If nothing is active, the most recently-finished leaf.
  //   3. If no leaf has any state yet (we're still descending through
  //      composite parents), the most recently-active composite, so
  //      the panel shows where execution currently is.
  // Composite parents (include / iterate / branch / parallel /
  // compensate) are skipped at the leaf level because they stay
  // `running` for the entire duration of their children and complete
  // *after* them: comparing by latest state-change timestamp would
  // always make the outermost parent win.
  const kindByID = useMemo(() => {
    const m = new Map();
    if (doc && doc.nodes) for (const n of doc.nodes) m.set(n.id, (n.data && n.data.kind) || n.kind || '');
    return m;
  }, [doc]);
  const isComposite = useCallback((id) => {
    const k = kindByID.get(id) || '';
    return k === 'include' || k === 'iterate' || k === 'branch' ||
           k === 'parallel' || k === 'compensate';
  }, [kindByID]);
  useEffect(() => {
    if (userSelected) return;
    if (!stateOverlay || !stateOverlay.nodes) return;
    const nodes = Object.values(stateOverlay.nodes);
    const startedAt = (n) => n.started_at ? Date.parse(n.started_at) : 0;
    const finishedAt = (n) => n.finished_at ? Date.parse(n.finished_at) : 0;
    const isActive = (n) => n.status === 'running' || n.status === 'delaying';
    // Tier 1: latest active leaf (running or delaying). started_at is
    // the right key here — finished_at is meaningless for active nodes.
    let pick = null;
    let pickT = -Infinity;
    for (const n of nodes) {
      if (isComposite(n.id)) continue;
      if (!isActive(n)) continue;
      const t = startedAt(n);
      if (t > pickT) { pick = n; pickT = t; }
    }
    // Tier 2: nothing active — fall back to most recently-finished leaf.
    if (!pick) {
      for (const n of nodes) {
        if (isComposite(n.id)) continue;
        const t = Math.max(startedAt(n), finishedAt(n));
        if (t > pickT) { pick = n; pickT = t; }
      }
    }
    // Tier 3: no leaf has any state — pick the most recently-active
    // composite so the panel still shows current location.
    if (!pick) {
      for (const n of nodes) {
        const t = Math.max(startedAt(n), finishedAt(n));
        if (t > pickT) { pick = n; pickT = t; }
      }
    }
    if (pick && pick.id !== selectedNode) {
      setSelectionIsExplicit(false);
      setSelectedNode(pick.id);
    }
  }, [stateOverlay, userSelected, selectedNode, isComposite]);

  const visibleSelectedNode = visibleSelectedNodeID(
    selectedNode,
    selectionIsExplicit,
    runID,
    stateOverlay,
    pending,
  );

  const structuralDoc = useMemo(() => doc ? withBranchMerges(doc) : null, [doc]);

  // Ordered, navigable list of nodes for prev/next cycling. Mirrors
  // doc.nodes ordering so the panel matches the prose pane.
  const nodeOrder = useMemo(
    () => structuralDoc && structuralDoc.nodes
      ? structuralDoc.nodes.filter(n => !(n.data && n.data.synthetic)).map(n => n.id)
      : [],
    [structuralDoc],
  );
  const cycleStep = useCallback((delta) => {
    if (!nodeOrder.length) return;
    const idx = visibleSelectedNode ? nodeOrder.indexOf(visibleSelectedNode) : -1;
    const next = idx < 0 ? (delta > 0 ? 0 : nodeOrder.length - 1)
      : Math.max(0, Math.min(nodeOrder.length - 1, idx + delta));
    setUserSelected(true);
    setSelectionIsExplicit(true);
    setSelectedNode(nodeOrder[next]);
  }, [nodeOrder, visibleSelectedNode]);

  // Run dagre once per document structure or style change. Selection / status changes
  // must NOT re-run the layout, otherwise React Flow's fitView re-fits
  // on every tick and the viewport zooms erratically (e.g. after a
  // second run completes, focus snaps to the most recently updated
  // subgraph and earlier steps appear to vanish off-screen).
  const baseLayout = useMemo(
    () => structuralDoc ? layoutDocument(structuralDoc, nodeStyle) : { nodes: [], edges: [] },
    [structuralDoc, nodeStyle],
  );

  // Trim mode: hide nodes in branch arms that were not taken. We
  // compute the visible set from the *full* doc — execution state
  // dictates which arms are dead — and then either filter the full
  // layout (preserving exact positions) or re-run dagre on the
  // trimmed sub-doc (compacting away the empty regions where the
  // dead arms used to sit).
  //
  // Live(id) := state entry exists for id OR for any descendant in
  // the rendered edge graph. Edge B->C is dead iff B is a 'branch'
  // with a state entry AND C is not live. BFS from in-degree-0 roots
  // using only non-dead edges yields the visible set; any node not
  // reached is hidden.
  const visibleGraph = useMemo(() => {
    if (!trim || !structuralDoc) return null; // null = no filter
    const overlayNodes = (stateOverlay && stateOverlay.nodes) || {};
    const allEdges = baseLayout.edges || [];
    const allNodes = baseLayout.nodes || [];
    if (!allNodes.length) return null;
    return trimVisibleGraph(allNodes, allEdges, overlayNodes);
  }, [trim, structuralDoc, baseLayout, stateOverlay]);

  // Trim layout: re-run dagre on the trimmed sub-doc so the visible
  // nodes pack tightly without leaving the gaps where dead arms used
  // to sit. We construct a sub-doc with only the visible step nodes
  // and the edges between them; frames/regions are recomputed from
  // those positions inside layoutDocument. This DOES move surviving
  // nodes — that's the point of compacting — but only while trim is
  // on; toggling trim off restores the cached full-doc layout
  // verbatim.
  const trimmedLayout = useMemo(() => {
    if (!visibleGraph || !structuralDoc) return null;
    const subDoc = {
      ...structuralDoc,
      nodes: structuralDoc.nodes.filter(n => visibleGraph.nodeIDs.has(n.id)),
      edges: structuralDoc.edges.filter(e => visibleGraph.edgeIDs.has(graphEdgeID(e))),
    };
    return layoutDocument(subDoc, nodeStyle);
  }, [visibleGraph, structuralDoc, nodeStyle]);

  // Choose the active layout source: trimmed when trim is on,
  // full-doc layout otherwise. Decorate with overlay status +
  // selection. Position comes from whichever layout we picked.
  const layout = useMemo(() => {
    const src = trimmedLayout || baseLayout;
    const overlayNodes = (stateOverlay && stateOverlay.nodes) || {};
    return {
      edges: src.edges.map(ed => {
        const targetState = edgeRuntimeState(ed, overlayNodes);
        const className = edgeRuntimeClass(targetState);
        return { ...ed, className, animated: className === 'edge-running' };
      }),
      nodes: src.nodes.map(n => {
        const ns = overlayNodes[n.id];
        const data = { ...n.data, selected: n.id === visibleSelectedNode };
        const phases = breakpoints.filter(item => (item.nodeID || item.step) === n.id).map(item => item.phase);
        if (phases.length > 0) data.debugBreakpoint = phases.join(' + ');
        if (ns) {
          data.status = ns.status;
          data.duration_ms = ns.duration_ms;
          data.delay_ms = ns.delay_ms;
          if (ns.debug_override) data.debugOverride = ns.debug_override;
        }
        return { ...n, data };
      }),
    };
  }, [baseLayout, trimmedLayout, stateOverlay, visibleSelectedNode, breakpoints]);

  // The trimmed layout already excludes hidden nodes; the full layout
  // shows everything. Either way `layout` is exactly what we want to
  // render — no further filtering needed.
  const displayLayout = layout;

  return e(React.Fragment, null,
    e('header', null,
      e('strong', null, 'yawr'),
      e('input', { value: runbookPath, onChange: ev => setRunbookPath(ev.target.value), placeholder: '/abs/path/to/x.runbook.yaml' }),
      e('input', { value: inputsJSON, onChange: ev => setInputsJSON(ev.target.value), placeholder: 'inputs JSON (optional)', style: { width: 220 } }),
      e('button', { onClick: () => loadDoc({ manual: true }), disabled: !runbookPath && !runID }, 'Load'),
      e('button', { onClick: () => startRun(shouldStartDebugRun(breakpoints, selectedDebugProfileID)), disabled: !runbookPath || isStarting || (!!runID && !isTerminal) },
        isStarting ? 'Starting\u2026' : (runID && !isTerminal ? 'Running\u2026' : (isTerminal ? 'Run again' : 'Run'))),
      e('button', {
        className: 'toggle' + (isDebugRun ? ' on' : ''),
        onClick: () => startRun(true),
        disabled: !runbookPath || (breakpoints.length === 0 && !selectedDebugProfileID) || isStarting || (!!runID && !isTerminal),
        title: breakpoints.length === 0 && !selectedDebugProfileID ? 'Add a breakpoint or select a debug profile' : 'Start an explicitly debugged run',
      }, 'Debug Run'),
      e('select', {
        className: 'style-picker',
        value: selectedDebugProfileID,
        disabled: !!runID && !isTerminal,
        onChange: event => setSelectedDebugProfileID(event.target.value),
        title: 'Reusable debug profile for this root runbook',
      },
        e('option', { value: '' }, 'Debug profile: none'),
        debugProfiles.map(item => e('option', { key: item.id, value: item.id },
          (item.stale ? '[stale] ' : '') + item.name,
        )),
      ),
      runID && !isTerminal && e('button', { className: 'danger', onClick: cancelRun }, 'Cancel'),
      runID && e('span', { className: 'runID' }, runID + (runStatus ? ' \u2014 ' + runStatus : '')),
      runID && e('span', {
        className: 'conn ' + connStatus,
        title: 'Live state stream: ' + connStatus,
      }, e('span', { className: 'dot' }), connStatus),
      e('span', { style: { flex: 1 } }),
      e('select', {
        className: 'style-picker',
        value: nodeStyle,
        onChange: ev => updateStyle(ev.target.value),
        title: 'Visual stereotype style (configurable via VS Code setting yawr.preview.nodeStyle)',
      },
        e('option', { value: 'smooth-curves' }, 'Style: Smooth Bauhaus'),
        e('option', { value: 'minimalist' }, 'Style: Linear Minimalist'),
        e('option', { value: 'header-badges' }, 'Style: Vercel Cards'),
      ),
      e('button', {
        className: 'toggle' + (showProse ? ' on' : ''),
        onClick: () => setShowProse(v => !v),
        title: 'Toggle prose pane',
      }, 'Prose'),
      e('button', {
        className: 'toggle' + (showPanel ? ' on' : ''),
        onClick: () => setShowPanel(v => !v),
        title: 'Toggle step panel',
      }, 'Panel'),
      e('button', {
        className: 'toggle' + (trim ? ' on' : ''),
        onClick: () => setTrim(v => !v),
        title: 'Hide steps in branch arms that were not taken (positions unchanged)',
      }, 'Trim'),
    ),
    e(InputsForm, {
      decls: (doc && doc.inputs) || [],
      values: formValues,
      setValue: (name, v) => setFormValues(prev => ({ ...prev, [name]: v })),
      disabled: inputsJSON.trim() !== '',
    }),
    e('div', { className: 'body style-' + nodeStyle },
      e('div', { className: 'graph' },
        doc
          ? e(ReactFlowProvider, null,
              e(GraphCanvas, {
                docHash: (doc && doc.hash) || 'doc',
                runID,
                nodes: displayLayout.nodes,
                edges: displayLayout.edges,
                selectedNode: visibleSelectedNode,
                onUserPan: () => setUserSelected(true),
                onNodeClick,
              }),
            )
          : e('div', { className: 'empty' }, error || 'Enter a runbook path and click Load.'),
        (error || (isTerminal && runStatus !== 'completed')) && e('div', { className: 'errorBar' },
          error || (() => {
            const failed = stateOverlay && stateOverlay.nodes
              ? Object.values(stateOverlay.nodes).find(n => n.status === 'failed')
              : null;
            return failed ? `${failed.id}: ${failed.error || 'failed'}` : `Run ${runStatus}`;
          })()
        ),
      ),
      doc && showProse && e(ProsePane, {
        doc,
        runbookPath,
        overlay: stateOverlay,
        structuralNodeIDs: nodeOrder,
        selectedNode: visibleSelectedNode,
        onSelect: (id) => { setUserSelected(true); setSelectionIsExplicit(true); setSelectedNode(id); },
      }),
      doc && showPanel && e(StepPanel, {
        nodeID: visibleSelectedNode,
        doc,
        overlay: stateOverlay,
        pending,
        submitAnswer,
        cycleStep,
        nodeOrder,
        breakpoints,
        breakpointsDisabled: !!runID && !isTerminal,

function boundedQuerySample(columns, rows) {
  const visibleColumns = [];
  const sampleRows = [];
  let budget = Math.max(0, QUERY_RESULT_TOTAL_CHAR_BUDGET - QUERY_RESULT_UI_TEXT_RESERVE);
  let budgetExhausted = false;
  for (let i = 0; i < columns.length; i++) {
    const source = columns[i];
    const label = formatQueryCell(source);
    const listCost = label.length + (visibleColumns.length > 0 ? 2 : 0);
    const headerCost = label.length;
    const cost = listCost + headerCost;
    if (cost > budget) {
      if (visibleColumns.length === 0 && budget > 2) {
        const capped = truncateToBudget(label, Math.floor(budget / 2));
        visibleColumns.push({ source, label: capped });
        budget -= capped.length * 2;
      }
      budgetExhausted = true;
      break;
    }
    visibleColumns.push({ source, label });
    budget -= cost;
  }
  const columnsTruncated = visibleColumns.length < columns.length;
  const columnSummary = columns.length === 0
    ? '(none)'
    : visibleColumns.map(c => c.label).join(', ') + (columnsTruncated ? ', \u2026' : '');

  if (visibleColumns.length > 0) {
    for (const row of rows.slice(0, QUERY_RESULT_SAMPLE_ROWS)) {
      const cells = [];
      let rowCost = 0;
      for (let i = 0; i < visibleColumns.length; i++) {
        const col = visibleColumns[i];
        const text = formatQueryCell(queryCellValue(row, col.source, i));
        cells.push(text);
        rowCost += text.length;
      }
      if (rowCost > budget) {
        if (sampleRows.length === 0 && budget > 0) {
          sampleRows.push({ cells: fitCellsToBudget(cells, budget) });
          budget = 0;
        }
        budgetExhausted = true;
        break;
      }
      budget -= rowCost;
      sampleRows.push({ cells });
    }
  }
  return {
    columns: visibleColumns,
    columnSummary,
    rows: sampleRows,
    columnsTruncated,
    budgetExhausted,
    truncated: sampleRows.length < rows.length || columnsTruncated || budgetExhausted,
  };
}

function queryCellValue(row, column, index) {
  if (Array.isArray(row)) return row[index];
  if (row && typeof row === 'object') return row[column];
  return row;
}

function formatQueryCell(value) {
  let text;
  if (value === undefined || value === null) text = '';
  else if (typeof value === 'string') text = value;
  else {
    try { text = JSON.stringify(value); } catch { text = String(value); }
  }
  return truncateToBudget(text, QUERY_RESULT_CELL_CHAR_LIMIT);
}

function truncateToBudget(text, budget) {
  if (budget <= 0) return '';
  if (text.length <= budget) return text;
  if (budget === 1) return '\u2026';
  return text.slice(0, budget - 1) + '\u2026';
}

function fitCellsToBudget(cells, budget) {
  return cells.map(cell => {
    if (budget <= 0) return '';
    const out = truncateToBudget(cell, budget);
    budget -= out.length;
    return out;
  });
}

function queryDiagnosticExcerpt(output, name) {
  const excerptKey = name + '_excerpt';
  const truncatedKey = name + '_truncated';
  if (output && output[excerptKey] !== undefined && output[excerptKey] !== null) {
    return { text: String(output[excerptKey]), truncated: !!output[truncatedKey] };
  }
  if (!output || output[name] === undefined || output[name] === null) return { text: '', truncated: false };
  const text = String(output[name]);
  return { text: truncateToBudget(text, QUERY_RESULT_DIAGNOSTIC_CHAR_BUDGET), truncated: text.length > QUERY_RESULT_DIAGNOSTIC_CHAR_BUDGET };
}

// VarsPanel renders the runtime variable scope: initial runbook vars

function DebugBreakForm({ pending, submit, saveDebugProfile }) {
  const debug = pending.debug || {};
  const actual = debug.actual || null;
  const [status, setStatus] = useState(() => actual && actual.status || 'completed');
  const [outputPatchText, setOutputPatchText] = useState('{}');
  const [varsText, setVarsText] = useState('{}');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [profileName, setProfileName] = useState('');
  const [saveState, setSaveState] = useState('');
  const breadcrumb = (debug.callPath || []).map(frame => frame.step_id).concat([pending.stepID]).join(' > ');
  const currentVars = JSON.stringify(debug.variables || {}, null, 2);

  const send = async body => {
    setBusy(true);
    setErr('');
    try {
      await submit(body);
    } catch (error) {
      setErr(String(error && error.message || error));
      setBusy(false);
    }
  };
  const continueUnchanged = () => send({ kind: 'debug_break', action: 'continue' });
  const stepInto = () => send({ kind: 'debug_break', action: 'step_into' });
  const stepOver = () => send({ kind: 'debug_break', action: 'step_over' });
  const stepOut = () => send({ kind: 'debug_break', action: 'step_out' });
  const stop = () => send({ kind: 'debug_break', action: 'stop' });
  const effectiveSet = () => {
    const vars = JSON.parse(varsText || '{}');
    if (!vars || Array.isArray(vars) || typeof vars !== 'object') {
      throw new Error('Variable overrides must be a JSON object.');
    }
    const set = { vars };
    if (actual) {
      const outputPatch = JSON.parse(outputPatchText || '{}');
      if (!outputPatch || Array.isArray(outputPatch) || typeof outputPatch !== 'object') {
        throw new Error('Output merge patch must be a JSON object.');
      }
      set.status = status;
      if (Object.keys(outputPatch).length > 0) {
        if (debug.outputProtected) throw new Error('Governance-redacted output cannot be overridden.');
        set.output_patch = outputPatch;
      }
    }
    return set;
  };
  const apply = async () => {
    try { await send({ kind: 'debug_break', action: 'continue', set: effectiveSet() }); }
    catch (error) { setErr(String(error && error.message || error)); }
  };
  const saveProfile = async () => {
    if (!saveDebugProfile) return;
    if (!profileName.trim()) { setErr('Enter a profile name.'); return; }
    setSaveState('saving'); setErr('');
    try {
      await saveDebugProfile({
        name: profileName.trim(),
        target: {
          call_path: (debug.callPath || []).map(frame => ({ ...frame })),
          step: pending.stepID,
          phase: debug.phase,
        },
        set: effectiveSet(),
      });
      setSaveState('saved');
    } catch (error) {
      setSaveState('');
      setErr(String(error && error.message || error));
    }
  };

  return e('div', { className: 'debug-break interaction' },
    e('h4', null, 'Paused ' + (debug.phase || '') + ' step'),
    e('div', { className: 'breadcrumb' }, breadcrumb),
    e('label', null, 'Current variables'),
    e('pre', null, currentVars),
    Array.isArray(debug.watches) && debug.watches.length > 0 && e('div', { className: 'debug-audit' },
      e('h4', null, 'Watches'),
      e('dl', null, ...debug.watches.flatMap((watch, index) => [
        e('dt', { key: 'watch-expression-' + index }, watch.expression),
        e('dd', { key: 'watch-value-' + index }, watch.error || JSON.stringify(watch.value)),
      ])),
    ),
    e('label', { htmlFor: 'debug-vars' }, 'Variable overrides'),
    e('textarea', {
      id: 'debug-vars', value: varsText, disabled: busy,
      onChange: event => setVarsText(event.target.value),
    }),
    actual && e(React.Fragment, null,
      e('h4', null, 'Actual result'),
      e('div', { className: 'queryMeta' }, 'Status: ' + actual.status),
      actual.error && e('div', { className: 'err' }, actual.error),
      e('pre', null, JSON.stringify(actual.output || {}, null, 2)),
      e('h4', null, 'Effective result'),
      e('label', { htmlFor: 'debug-status' }, 'Status'),
      e('select', {
        id: 'debug-status', value: status, disabled: busy,
        onChange: event => setStatus(event.target.value),
      },
        e('option', { value: 'completed' }, 'completed'),
        e('option', { value: 'failed' }, 'failed'),
        e('option', { value: 'skipped' }, 'skipped'),
      ),
      e('label', { htmlFor: 'debug-output' }, 'Output JSON'),
      e('textarea', {
        id: 'debug-output', value: outputPatchText, disabled: busy || !!debug.outputProtected,
        onChange: event => setOutputPatchText(event.target.value),
      }),
      e('div', { className: 'hint' }, debug.outputProtected
        ? 'Governance-redacted output is read-only.'
        : 'JSON merge patch; unchanged and unseen output fields are preserved.'),
    ),
    saveDebugProfile && e('div', { className: 'debug-controls' },
      e('h4', null, 'Save for another run'),
      e('label', { htmlFor: 'debug-profile-name' }, 'Profile name'),
      e('input', {
        id: 'debug-profile-name', type: 'text', value: profileName, disabled: saveState === 'saving',
        onChange: event => { setProfileName(event.target.value); setSaveState(''); },
      }),
      e('button', {
        className: 'secondary', onClick: saveProfile,
        disabled: !profileName.trim() || saveState === 'saving',
      }, saveState === 'saving' ? 'Saving...' : (saveState === 'saved' ? 'Saved' : 'Save as debug profile')),
    ),
    err && e('div', { className: 'err' }, err),
    e('div', { className: 'actions' },
      e('button', { className: 'secondary', onClick: continueUnchanged, disabled: busy }, 'Continue unchanged'),
      e('button', { onClick: apply, disabled: busy }, 'Apply & Continue'),
      debug.phase === 'before' && debug.canStepInto && e('button', { className: 'secondary', onClick: stepInto, disabled: busy }, 'Step Into'),
      e('button', { className: 'secondary', onClick: stepOver, disabled: busy }, 'Step Over'),
      (debug.callPath || []).length > 0 && e('button', { className: 'secondary', onClick: stepOut, disabled: busy }, 'Step Out'),
      e('button', { className: 'danger', onClick: stop, disabled: busy }, 'Stop'),
    ),
  );
}

function HostActionPending({ pending }) {
  const request = pending.host_action || {};
  const standalone = window.parent === window;
  return e('div', { className: 'interaction' },
    e('h4', null, 'Host action'),
    e('div', { className: 'step' }, pending.stepID || ''),
    e('div', { className: 'hint' },
      standalone
        ? 'This action requires a connected host integration; no host work was started.'
        : 'Waiting for the connected host to acknowledge the action.'),
    e('dl', null,
      e('dt', null, 'capability'),
      e('dd', null, request.capability || ''),
    ),
  );
}

// PromptBlock renders a step's resolved prompt. Prompts often contain
// multi-line content (e.g. accumulated reports from `collect` joins);
// rendering inside a heading collapsed all whitespace and produced an
// unreadable wall of text, so we use a pre-styled block that preserves
// newlines and wraps long lines.
function PromptBlock({ text }) {
  return e('div', {
    style: {
      margin: '0 0 8px',
      padding: '8px 10px',
      background: 'var(--bg-muted, #1e1e1e)',
      border: '1px solid var(--border)',
      borderRadius: 4,
      fontFamily: 'inherit',
      fontSize: 13,
      lineHeight: 1.45,
      whiteSpace: 'pre-wrap',
      wordBreak: 'break-word',
    },
  }, text || '');
}

// InteractionRecord renders the resolved prompt + submitted answer for
// a completed interactive step (collector / decision / choice). The
// engine echoes both into step/completed.output.interaction so we can
// replay what the user saw and answered.
function InteractionRecord({ record }) {
  const renderAnswer = () => {
    const a = record.answer || {};
    if (record.kind === 'decision') {
      return e('div', null,
        e('span', { style: { color: 'var(--fg-muted)' } }, 'route: '),
        e('strong', null, a.label || ''));
    }
    if (record.kind === 'choice') {
      const sel = Array.isArray(a.selected) ? a.selected : [];
      if (sel.length === 0) return e('span', { style: { color: 'var(--fg-muted)' } }, '(no selection)');
      return e('ul', { style: { margin: '4px 0 0 16px', padding: 0 } },
        ...sel.map((s, i) => e('li', { key: 'sel-' + i }, String(s))));
    }
    // collector: a is a {field: value} map
    const entries = Object.entries(a);
    if (entries.length === 0) return e('span', { style: { color: 'var(--fg-muted)' } }, '(no fields)');
    return e('dl', null,
      ...entries.flatMap(([k, v]) => [
        e('dt', { key: 'ak-' + k }, k),
        e('dd', { key: 'av-' + k, style: { whiteSpace: 'pre-wrap' } }, v == null ? '' : String(v)),
      ]),
    );
  };
  return e('div', { style: { marginTop: 12 } },
    record.preview_truncated && e('div', { className: 'queryMeta' }, 'Interaction preview truncated; full details are available from the run trace.'),
    e('div', { style: { fontSize: 11, color: 'var(--fg-muted)', marginBottom: 4 } }, 'Prompt'),
    record.prompt
      ? e(PromptBlock, { text: record.prompt })
      : e('span', { style: { color: 'var(--fg-muted)', fontSize: 11 } }, '(no prompt)'),
    e('div', { style: { fontSize: 11, color: 'var(--fg-muted)', margin: '8px 0 4px' } }, 'Answer'),
    renderAnswer(),
  );
}

// ProsePane fetches the runbook's "prose" rendering (Markdown) from the
// server, renders it as HTML, and tags each <li> with the step ID it
// describes so we can highlight + scroll to the currently-selected step.
//
// The server's prose renderer (pkg/preview/render/prose) wraps every
// step ID in backticks via titleOrID(); we recover that linkage by
// scanning <code> elements after Markdown→HTML and walking up to the
// nearest <li>.
function ProsePane({ doc, runbookPath, overlay, structuralNodeIDs, selectedNode, onSelect }) {
  const ref = React.useRef(null);
  const [html, setHtml] = useState('');
  const [err, setErr] = useState('');

  useEffect(() => {
    if (doc && (doc.presentation_state || doc.nodes?.some(node => node.data?.details?.code_presentation?.origin === 'frozen'))) {
      setHtml(''); setErr('Historical prose unavailable — not retained. Frozen step details remain available in the inspector.');
      return;
    }
    if (!runbookPath) { setHtml(''); return; }
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch('/preview/document?format=prose&runbookPath=' + encodeURIComponent(runbookPath));
        if (!res.ok) throw new Error(await res.text());
        const md = await res.text();
        if (cancelled) return;
        setHtml(DOMPurify.sanitize(marked.parse(md, { gfm: true, breaks: false })));
        setErr('');
      } catch (e) {
        if (!cancelled) { setErr(String(e)); setHtml(''); }
      }
    })();
    return () => { cancelled = true; };
  }, [runbookPath, doc && doc.presentation_state && doc.presentation_state.run_id, doc && doc.hash]);

  // After each render, walk <code> elements and tag the enclosing <li>
  // with data-step-id so we can style + scroll to it.
  useEffect(() => {
    if (!ref.current || !doc) return;
    const ids = new Set(doc.nodes.map(n => n.id));
    const renderedIDs = new Set(structuralNodeIDs || doc.nodes.map(n => n.id));
    const codes = ref.current.querySelectorAll('code');
    codes.forEach(c => {
      if (c.closest('pre,figure,.yawr-code')) return;
      const id = c.textContent.trim();
      if (!ids.has(id)) return;
      const li = c.closest('li');
      if (!li) return;
      if (!renderedIDs.has(id)) {
        li.style.display = 'none';
        return;
      }
      li.style.display = '';
      // Only tag the first <li> we encounter for an ID; nested ones
      // will be tagged separately on their own match.
      if (!li.hasAttribute('data-step-id')) {
        li.setAttribute('data-step-id', id);
        li.style.cursor = 'pointer';
        li.addEventListener('click', (ev) => {
          ev.stopPropagation();
          onSelect(id);
        });
      }
    });
    // Decorate with current overlay status (status pill via class).
    const overlayNodes = (overlay && overlay.nodes) || {};
    ref.current.querySelectorAll('li[data-step-id]').forEach(li => {
      const id = li.getAttribute('data-step-id');
      li.classList.remove('running', 'completed', 'failed', 'skipped', 'cancelled', 'pending');
      const ns = overlayNodes[id];
      li.classList.add(ns ? ns.status : 'pending');
    });
  }, [html, doc, overlay, structuralNodeIDs, onSelect]);
  useEffect(() => ref.current ? highlightFences(ref.current) : undefined, [html]);

  // Scroll selected step into view + highlight.
  useEffect(() => {
    if (!ref.current) return;
    ref.current.querySelectorAll('li.selected').forEach(li => li.classList.remove('selected'));
    if (!selectedNode) return;
    const li = ref.current.querySelector(`li[data-step-id="${cssEscape(selectedNode)}"]`);
    if (li) {
      li.classList.add('selected');
      if (li.scrollIntoView) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }, [selectedNode, html]);

  return e('aside', { className: 'prose', ref },
    err && e('div', { className: 'err' }, err),
    e('div', { dangerouslySetInnerHTML: { __html: html } }),
  );
}

// CSS.escape polyfill for older webviews that lack it.
function cssEscape(s) {
  if (typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(s);
  return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
}

function newPreviewSessionID() {
  const bytes = new Uint8Array(16);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  }
  return 'preview-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
}

function previewParentTargetOrigin() {
  if (window.parent === window) return null;

  const normalizeParentOrigin = (raw) => {
    if (!raw) return null;
    try {
      const parsed = new URL(raw);
      if (parsed.origin && parsed.origin !== 'null') return parsed.origin;
      if (parsed.protocol === 'vscode-webview:' && parsed.host) {
        return parsed.protocol + '//' + parsed.host;
      }
    } catch (_) { /* malformed origin */ }
    return null;
  };
  const isTrustedPreviewParentOrigin = (origin) => {
    if (!origin) return false;
    if (origin === location.origin) return true;
    try { return new URL(origin).protocol === 'vscode-webview:'; }
    catch (_) { return false; }
  };

  const ancestorOrigin = normalizeParentOrigin(
    location.ancestorOrigins && location.ancestorOrigins.length > 0
      ? location.ancestorOrigins[0] : null,
  );
  const referrerOrigin = normalizeParentOrigin(document.referrer);
  let paramOrigin = null;
  try {
    const raw = new URLSearchParams(location.search).get('parentOrigin');
    paramOrigin = normalizeParentOrigin(raw);
  } catch (_) { /* malformed parameter — ignore */ }

  if (ancestorOrigin && referrerOrigin && ancestorOrigin !== referrerOrigin) return null;
  const browserOrigin = ancestorOrigin || referrerOrigin;
  if (!browserOrigin || !paramOrigin || browserOrigin !== paramOrigin) return null;
  return isTrustedPreviewParentOrigin(browserOrigin) ? browserOrigin : null;
}

function InteractionPane({ pending, submit }) {
  if (pending.kind === 'choice') {
    return e(ChoiceForm, { pending, submit });
  }
  if (pending.kind === 'decision') {
    return e(DecisionForm, { pending, submit });
  }
  if (pending.kind === 'collector') {
    return e(CollectorForm, { pending, submit });
  }
  return null;
}

function ChoiceForm({ pending, submit }) {
  const [sel, setSel] = useState(() => {
    // Pre-select default values if any option marks itself default.
    return [];
  });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const min = pending.min || 0;
  const max = pending.max || 0;
  const toggle = (v) => setSel(s => {
    if (!pending.multiple) return [v];
    return s.includes(v) ? s.filter(x => x !== v) : s.concat([v]);
  });
  const onSubmit = async () => {
    if (sel.length === 0) { setErr('Pick at least one option.'); return; }
    if (min && sel.length < min) { setErr('Pick at least ' + min + '.'); return; }
    if (max && sel.length > max) { setErr('Pick at most ' + max + '.'); return; }
    setBusy(true); setErr('');
    try { await submit({ kind: 'choice', selected: sel }); }
    catch (e) { setErr(String(e && e.message || e)); setBusy(false); }
  };
  return e('div', { className: 'interaction' },
    e(PromptBlock, { text: pending.prompt || 'Choose' }),
    e('div', { className: 'step' }, pending.stepID),
    (pending.options || []).map(o => e('div', { key: o.value, className: 'opt' },
      e('input', { type: pending.multiple ? 'checkbox' : 'radio', id: o.value, checked: sel.includes(o.value), onChange: () => toggle(o.value) }),
      e('label', { htmlFor: o.value, style: { display: 'inline', margin: 0 } },
        o.label || o.display_value || o.value,
        o.hint && e('span', { className: 'hint', style: { marginLeft: 6 } }, o.hint),
      ),
    )),
    err && e('div', { className: 'err' }, err),
    e('button', { onClick: onSubmit, disabled: busy || sel.length === 0 }, busy ? 'Submitting\u2026' : 'Submit'),
  );
}

function DecisionForm({ pending, submit }) {
  const [busy, setBusy] = useState('');
  const [err, setErr] = useState('');
  const choose = async (label) => {
    setBusy(label); setErr('');
    try { await submit({ kind: 'decision', label }); }
    catch (e) { setErr(String(e && e.message || e)); setBusy(''); }
  };
  return e('div', { className: 'interaction' },
    e(PromptBlock, { text: pending.prompt || 'Decide' }),
    e('div', { className: 'step' }, pending.stepID),
    (pending.routes || []).map(r => e('div', { key: r.label, style: { marginBottom: 6 } },
      e('button', {
        style: { marginRight: 6 },
        disabled: !!busy,
        onClick: () => choose(r.label),
      }, busy === r.label ? (r.display_label || r.label) + '\u2026' : (r.display_label || r.label)),
      r.hint && e('span', { className: 'hint' }, r.hint),
    )),
    err && e('div', { className: 'err' }, err),
  );
}

// renderField returns the JSX for one collector field of the given
// type. It writes into the shared `vals` map via `set(name, value)`.
function renderField(f, vals, set) {
  const v = vals[f.name];
  const id = 'fld-' + f.name;
  switch (f.type) {
    case 'number':
    case 'integer':
      return e('input', {
        id, type: 'number', value: v ?? '',
        step: f.type === 'integer' ? 1 : 'any',
        onChange: ev => set(f.name, ev.target.value),
      });
    case 'date':
      return e('input', { id, type: 'date', value: v ?? '', onChange: ev => set(f.name, ev.target.value) });
    case 'datetime':
      return e('input', { id, type: 'datetime-local', value: v ?? '', onChange: ev => set(f.name, ev.target.value) });
    case 'boolean':
      return e('div', { className: 'check' },
        e('input', { id, type: 'checkbox', checked: !!v, onChange: ev => set(f.name, ev.target.checked) }),
        e('label', { htmlFor: id, style: { display: 'inline', margin: 0 } }, 'Yes'),
      );
    case 'secret':
    case 'password':
      return e('input', { id, type: 'password', value: v ?? '', autoComplete: 'off', onChange: ev => set(f.name, ev.target.value) });
    case 'email':
      return e('input', { id, type: 'email', value: v ?? '', onChange: ev => set(f.name, ev.target.value) });
    case 'url':
      return e('input', { id, type: 'url', value: v ?? '', onChange: ev => set(f.name, ev.target.value) });
    case 'select':
    case 'choice':
    case 'autocomplete': {
      // Multi-select renders as a list of checkboxes; single as a <select>.
      if (f.multiple) {
        const arr = Array.isArray(v) ? v : [];
        const toggle = (val) => set(f.name, arr.includes(val) ? arr.filter(x => x !== val) : arr.concat([val]));
        return e('div', null, (f.options || []).map(o => e('div', { key: o.value, className: 'opt' },
          e('input', { type: 'checkbox', id: id + '-' + o.value, checked: arr.includes(o.value), onChange: () => toggle(o.value) }),
          e('label', { htmlFor: id + '-' + o.value, style: { display: 'inline', margin: 0 } }, o.label || o.display_value || o.value),
        )));
      }
      return e('select', { id, value: v ?? '', onChange: ev => set(f.name, ev.target.value) },
        e('option', { value: '' }, f.required ? '\u2014 select \u2014' : '\u2014 (none) \u2014'),
        (f.options || []).map(o => e('option', { key: o.value, value: o.value }, o.label || o.display_value || o.value)),
      );
    }
    case 'textarea':
      return e('textarea', { id, value: v ?? '', rows: 3, onChange: ev => set(f.name, ev.target.value) });
    case 'text':
    default:
      if (f.multiline) {
        return e('textarea', { id, value: v ?? '', rows: 3, onChange: ev => set(f.name, ev.target.value) });
      }
      return e('input', { id, type: 'text', value: v ?? '', onChange: ev => set(f.name, ev.target.value) });
  }
}

// validateAndCoerce returns {values, errors}. Empty errors map = OK.
function validateAndCoerce(fields, vals) {
  const out = {};
  const errs = {};
  for (const f of (fields || [])) {
    const raw = vals[f.name];
    const isEmpty = raw == null || raw === '' || (Array.isArray(raw) && raw.length === 0);
    if (f.required && isEmpty && f.type !== 'boolean') {
      errs[f.name] = 'Required.';
      continue;
    }
    if (isEmpty) continue;
    switch (f.type) {
      case 'number': {
        const n = Number(raw);
        if (Number.isNaN(n)) { errs[f.name] = 'Must be a number.'; break; }
        out[f.name] = n; break;
      }
      case 'integer': {
        const n = Number(raw);
        if (!Number.isInteger(n)) { errs[f.name] = 'Must be an integer.'; break; }
        out[f.name] = n; break;
      }
      case 'boolean':
        out[f.name] = !!raw; break;
      default:
        out[f.name] = raw;
    }
  }
  return { values: out, errors: errs };
}

function CollectorForm({ pending, submit }) {
  // Initialise vals from each field's default.
  const fields = pending.fields || [];
  const [vals, setVals] = useState(() => {
    const init = {};
    for (const f of fields) {
      if (f.default !== undefined && f.default !== null) {
        if (f.type === 'boolean') init[f.name] = !!f.default;
        else init[f.name] = f.default;
      }
    }
    return init;
  });
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const [topErr, setTopErr] = useState('');
  const set = (k, v) => setVals(s => ({ ...s, [k]: v }));
  const onSubmit = async () => {
    const { values, errors: errs } = validateAndCoerce(fields, vals);
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;
    setBusy(true); setTopErr('');
    try { await submit({ kind: 'collector', values }); }
    catch (e) { setTopErr(String(e && e.message || e)); setBusy(false); }
  };
  return e('div', { className: 'interaction' },
    e(PromptBlock, { text: pending.prompt || 'Provide details' }),
    e('div', { className: 'step' }, pending.stepID),
    fields.map(f => e('div', { key: f.name, className: 'field' },
      e('label', { htmlFor: 'fld-' + f.name }, f.label || f.display_name || f.name, f.required && e('span', { className: 'req' }, '*')),
      renderField(f, vals, set),
      f.hint && e('div', { className: 'hint' }, f.hint),
      errors[f.name] && e('div', { className: 'err' }, errors[f.name]),
    )),
    topErr && e('div', { className: 'err' }, topErr),
    e('button', { onClick: onSubmit, disabled: busy }, busy ? 'Submitting\u2026' : 'Submit'),
  );
}

createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
