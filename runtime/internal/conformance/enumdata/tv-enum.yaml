    error_code: ENUM-008
  note: 'design/yawr/sections/08-security-and-trust.tex §Redacted enum member lists (C1): ''An ENUM-008
    message for a redacted declaration MUST NOT enumerate permitted values and MUST NOT echo the rejected
    value.'' Uses the S1 site (tool action args.<name> with redact: true, design/yawr/sections/06-tool-runtime.tex
    Tool Definition Schema), the one declaration site where a literal redact: true is schema-representable
    today (tool.yaml has no governing tool.v1.schema.json, C3, so the field is unconstrained; contrast
    the runbook Input/Output $defs, which have no comparable ''redact'' property -- a schema-completeness
    question flagged alongside DEFAULT-006, not an enum-semantics ambiguity). The GIS-interpolated ''strategy_var''
