            type: end
            outcome: {category: success, code: ok}
  expected:
    value: drained
  note: 'UNSUPPORTED-UNDER-CORPUS-FORMAT / schema gap (adjacent, not part of AR-ENUM-1..15''s own scope,
    surfaced while authoring this corpus): spec/schema-candidates/yawr-private-1990a6c/runbook.v1.schema.json $defs.Output has
    no ''default'' property (only type/description/value/enum), while $defs.Input does. AR-ENUM-6 states
    default-in-enum ''Applies at S1, S3, S4'', and design/yawr/sections/06-tool-runtime.tex §Output contract''s
    PKG-027 prose describes a substitute output that may ''declare a default'', which is itself an S4-shaped
    (runbook Output) declaration for the substitute''s own outputs: map. A literal ''outputs.<name>.default:''
    fixture at the runbook-Output site is therefore not schema-representable today. This vector is a deterministic
    placeholder: it exercises the S4 site''s enum production-time check on its actually-producible path
    (no default needed, since the step genuinely produces a member value) and documents the gap in ''note''
    rather than inventing an unsupported ''default'' field on Output. Flagged to Edith/Barbara (.squad/decisions/inbox/tess-enum-corpus-notes.md)
    as a schema-completeness question, not an enum-semantics ambiguity: AR-ENUM-6 remains binding and
    is exercised at S1 (DEFAULT-002), S2 (DEFAULT-003), and S3 (DEFAULT-001) with a literal ''default:''
    field; S4 needs the same field added to $defs.Output before an equivalent literal fixture is possible.'
  tags:
  - untestable-in-corpus-format
  - schema-gap
