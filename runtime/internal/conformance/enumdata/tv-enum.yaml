- id: TV-CONFORM-GOV-014
  category: CONFORM-CROSSCUT
  description: 'Invalid classification value in a package-exported tool MUST be rejected at catalog-load time with PKG-010.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      requires:
        - package: acme.gov-test
          version: "^1.0.0"
          path: ./vendor/acme-gov-test
      toolRefs:
        - name: probe
          package: acme.gov-test
      flow:
        - step:
            id: run
            type: tool
            tool:
              name: probe
              action: ping
              args: {}
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    vendor/acme-gov-test/yawr-package.yaml: |
      apiVersion: yawr.tool-package/v1
      meta:
        name: acme.gov-test
        version: "1.0.0"
      exports:
        tools:
          - id: probe
            path: tools/probe.tool.yaml
    vendor/acme-gov-test/tools/probe.tool.yaml: |
      apiVersion: yawr.tool/v1
      meta:
        name: probe
        version: "1.0.0"
      transport:
        mode: stdio
      actions:
        - name: ping
          classification: "invalid-class"
          argv: ["echo", "ok"]
          args: {}
  expected:
    error:
      code: PKG-010
  note: 'GOV-014: classification is a closed enum (read-only|mutating|destructive|unspecified). An unknown value in a package-exported tool causes ParseToolFile to fail; pkgcatalog wraps that failure as PKG-010 ("export references missing/invalid file"). The error class is PKG (not a new TOOL-PARSE class) because the enforcement point is ParseToolFile called from the catalog loader — the same wrapping point used for all other tool-file semantic validation failures. Empty string is also invalid (pointer tri-state: nil=absent is distinct from ""=explicit-empty) and is enforced by the same code path.'