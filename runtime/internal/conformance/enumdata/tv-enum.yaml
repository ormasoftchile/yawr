# Enum-Constrained Tool and Runbook Outputs MVP conformance corpus
# (AR-ENUM-1..15, .squad/decisions/inbox/barbara-enum-constraint-mvp-architecture-ruling.md,
# ratified 2026-08-10, §Handoff -> Tess).
#
# Generated by design/yawr/scripts/gen_enum_vectors.py (scaffolding, safe to
# delete once this file is reviewed/stable), mirroring the tv-pkg-resolve.yaml
# fixture shape: 'variables' models a synthetic workspace filesystem as a flat
# map from workspace-relative POSIX path to file content string; 'input' is
# the entry-point file. Declaration-only vectors (well-formedness, defaults,
# most of ENUM-DECL/ENUM-UNICODE) use a single self-contained runbook.yaml;
# vectors exercising S1 (tool action args) / S2 (substituted action outputs) /
# substitution (PKG-013) / package binding (mock) use the same
# real-package + substitute-runbook shape as tv-pkg-resolve.yaml's PKG-SUBST
# vectors.
#
# Categories: ENUM-DECL, ENUM-UNICODE, ENUM-DEFAULT, ENUM-PLAN, ENUM-RUNTIME,
# ENUM-SUBST, ENUM-MOCK, ENUM-TRACE. Every ENUM-001..009 and ENUM-W001 is
# exercised at least once, with at least one negative vector each; PKG-013's
# enum set-equality extension (AR-ENUM-8) is exercised in ENUM-SUBST and
# ENUM-MOCK. Two vectors (ENUM-UNICODE-002 "invalid UTF-8 member",
# ENUM-TRACE-001/002 trace-shape/redaction-surface claims) are tagged
# 'untestable-in-corpus-format': they pin a normative contract at the
# abstraction this schema supports rather than inventing unsupported fields,
# per the corpus's determinism rules (no timestamps, no host paths, no
# locale dependence; assert on codepoints, not rendered text).
#
# See .squad/agents/tess/history.md for the full coverage matrix and
# validation report.
vectors:
- id: TV-ENUM-DECL-001
  category: ENUM-DECL
  description: 'enum on a runbook input (S3) declared type: number is ENUM-001.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: number
          required: false
          enum: ["1", "2"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-001
  note: 'AR-ENUM-2: enum valid only when the declaration resolves to type: string.'
- id: TV-ENUM-DECL-002
  category: ENUM-DECL
  description: 'enum on a runbook input (S3) declared type: secret is ENUM-001 (C1): a secret''s value
    domain must not be enumerable.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        api_key:
          type: secret
          required: false
          enum: ["tokenA", "tokenB"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-001
  note: 'C1: enum forbidden on type: secret regardless of redact/sensitive_inputs status.'
- id: TV-ENUM-DECL-003
  category: ENUM-DECL
  description: 'enum on a tool action arg (S1) declared type: boolean is ENUM-001.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      requires:
        - package: acme.enum-tools
          version: "^1.0.0"
          path: ./vendor/acme-enum-tools
      toolRefs:
        - name: kubectl
          package: acme.enum-tools
      flow:
        - step:
            id: drain
            type: tool
            tool:
              name: kubectl
              action: drain-node
              args:
                node: node-1
            capture:
              drained: outputs.drained
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    vendor/acme-enum-tools/yawr-package.yaml: |
      apiVersion: yawr.tool-package/v1
      meta:
        name: acme.enum-tools
        version: "1.0.0"
      exports:
        tools:
          - id: kubectl
            path: tools/kubectl.tool.yaml
    vendor/acme-enum-tools/tools/kubectl.tool.yaml: |
      apiVersion: yawr.tool/v1
      meta:
        name: kubectl
        version: "1.0.0"
      transport:
        mode: stdio
      governance:
        allowed-modes: ["real"]
        requires-approval: true
      actions:
        - name: get-nodes
          argv: ["get", "nodes"]
          args: {}
        - name: drain-node
          execute:
            kind: runbook
            path: ../runbooks/drain-node.yaml
          args:
            node: {type: string, required: true}
            force:
              type: boolean
              required: false
              enum: ["true", "false"]
          outputs:
            drained: {type: boolean}
    vendor/acme-enum-tools/runbooks/drain-node.yaml: |
      apiVersion: yawr.runbook/v1
      id: acme.enum-tools/drain-node
      name: drain-node
      inputs:
        node: {type: string, required: true, from: context}
        strategy:
          type: string
          required: false
          from: context
          default: graceful
          enum: ["graceful", "force"]
      outputs:
        drained: {type: boolean, value: "step.drain.json.drained"}

      flow:
        - step:
            id: drain
            type: cli
            command: bash
            args: ["-c", "echo '{\"drained\": true}'"]
            capture:
              drain: json
  expected:
    error_class: ENUM
    error_code: ENUM-001
  note: 'S1: tool action args.<name>. Governing section: 06-tool-runtime.tex Tool Definition Schema.'
- id: TV-ENUM-DECL-004
  category: ENUM-DECL
  description: enum value that is a YAML mapping (not a sequence) at a runbook input (S3) is ENUM-002.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: {a: 1, b: 2}

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-002
  note: 'AR-ENUM-3(1): enum MUST be a YAML sequence.'
- id: TV-ENUM-DECL-005
  category: ENUM-DECL
  description: 'An empty enum sequence ([]) at a runbook input (S3) is ENUM-002 (minItems: 1 violated).'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: []

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-002
  note: 'AR-ENUM-3(2): a zero-member domain is always an authoring mistake, never ''no values allowed''.'
- id: TV-ENUM-DECL-006
  category: ENUM-DECL
  description: 'Unquoted enum members true/false resolve to YAML 1.2 core-schema booleans, not strings: ENUM-002,
    no coercion.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        answer:
          type: string
          required: false
          enum: [true, false]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-002
  note: 'AR-ENUM-3(3): under the YAML 1.2 core schema, unquoted yes/no resolve to strings, not booleans
    -- only true/True/TRUE/false/False/FALSE resolve to booleans. Authors must quote any member that
    would otherwise resolve to a non-string core-schema type: enum: ["true", "false"].'
  tags:
  - yaml-1.2-core-schema
- id: TV-ENUM-DECL-007
  category: ENUM-DECL
  description: An enum member that is itself a nested YAML sequence is ENUM-002.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: [["prod"], "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-002
  note: 'AR-ENUM-3(4): nested sequences/mappings as items are rejected.'
- id: TV-ENUM-DECL-008
  category: ENUM-DECL
  description: 'An enum member carrying an explicit YAML tag (!!int on a digit string) is ENUM-002: no
    coercion, no tag override.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: [!!int "1", "2"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-002
  note: 'AR-ENUM-3(4): explicit tags on items are rejected regardless of the tag''s target type.'
- id: TV-ENUM-DECL-009
  category: ENUM-DECL
  description: An enum member that is the empty string is ENUM-003.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod", ""]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-003
  note: 'AR-ENUM-3(5): empty string is indistinguishable from ''unset'' across from: env/prompt/CLI sourcing.'
- id: TV-ENUM-DECL-010
  category: ENUM-DECL
  description: An enum member that is whitespace-only is ENUM-003.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod", "   "]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-003
  note: 'AR-ENUM-3(5): whitespace-only member.'
- id: TV-ENUM-DECL-011
  category: ENUM-DECL
  description: 'An enum member with leading/trailing whitespace ('' prod'') is ENUM-003: an invisible
    distinction humans reviewing an incident artifact must not have to spot.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: [" prod", "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-003
  note: AR-ENUM-3(5).
- id: TV-ENUM-DECL-012
  category: ENUM-DECL
  description: Exact-duplicate enum members ('prod' twice) are ENUM-004.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod", "stage", "prod"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-004
  note: 'AR-ENUM-3(6): members MUST be pairwise distinct after NFC normalisation (trivial case: exact
    duplicates).'
- id: TV-ENUM-DECL-013
  category: ENUM-DECL
  description: Case-only-distinct members ('Prod'/'prod') are legal and match case-sensitively; a validator
    MUST emit ENUM-W001.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          default: prod
          enum: ["Prod", "prod"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    value: prod
    warnings:
    - ENUM-W001
  note: 'AR-ENUM-4: case-only-distinct pairs are NOT PKG-018 (no filesystem substrate); non-fatal warning
    only.'
- id: TV-ENUM-DECL-014
  category: ENUM-DECL
  description: 'enum on a runbook output (S4) declared type: integer is ENUM-001.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      outputs:
        drain_state:
          type: integer
          enum: ["1", "2"]

      flow:
        - step:
            id: drain
            type: cli
            command: bash
            args: ["-c", "echo drained"]
            capture:
              drain: stdout
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-001
  note: 'S4: runbook outputs.<name>. Governing section: 03-schema-vnext.tex Output Declarations.'
- id: TV-ENUM-DECL-015
  category: ENUM-UNICODE
  description: 'An enum member in NFD (decomposed combining-acute form) instead of NFC is ENUM-005: declared
    members MUST already be NFC.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        city:
          type: string
          required: false
          enum: ["café", "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-005
  note: 'AR-ENUM-4: normalisation is asymmetric -- the FILE itself must already be NFC.'
- id: TV-ENUM-UNICODE-001
  category: ENUM-UNICODE
  description: 'An NFD-form plan-time literal candidate matches an NFC-declared member: candidates are
    NFC-normalised before comparison, so this passes (asymmetric normalisation).'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      requires:
        - package: acme.enum-tools
          version: "^1.0.0"
          path: ./vendor/acme-enum-tools
      toolRefs:
        - name: kubectl
          package: acme.enum-tools
      flow:
        - step:
            id: drain
            type: tool
            tool:
              name: kubectl
              action: drain-node
              args:
                node: "cafe\u0301"
            capture:
              drained: outputs.drained
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    vendor/acme-enum-tools/yawr-package.yaml: |
      apiVersion: yawr.tool-package/v1
      meta:
        name: acme.enum-tools
        version: "1.0.0"
      exports:
        tools:
          - id: kubectl
            path: tools/kubectl.tool.yaml
    vendor/acme-enum-tools/tools/kubectl.tool.yaml: |+
      apiVersion: yawr.tool/v1
      meta:
        name: kubectl
        version: "1.0.0"
      transport:
        mode: stdio
      governance:
        allowed-modes: ["real"]
        requires-approval: true
      actions:
        - name: get-nodes
          argv: ["get", "nodes"]
          args: {}
        - name: drain-node
          execute:
            kind: runbook
            path: ../runbooks/drain-node.yaml
          args:
            node: {type: string, required: true}
            strategy:
              type: string
              required: false
              default: graceful
              enum: ["graceful", "force"]

          outputs:
            drained: {type: boolean}

    vendor/acme-enum-tools/runbooks/drain-node.yaml: |
      apiVersion: yawr.runbook/v1
      id: acme.enum-tools/drain-node
      name: drain-node
      inputs:
        node: {type: string, required: true, from: context}
        strategy:
          type: string
          required: false
          from: context
          default: graceful
          enum: ["graceful", "force"]
      outputs:
        drained: {type: boolean, value: "step.drain.json.drained"}

      flow:
        - step:
            id: drain
            type: cli
            command: bash
            args: ["-c", "echo '{\"drained\": true}'"]
            capture:
              drain: json
  expected:
    value: café
  note: 'AR-ENUM-4: ''declared members MUST already be NFC; candidate values from outside the file (env,
    prompt, provider, tool stdout, caller bindings) ARE NFC-normalised before comparison''. The literal
    caller-supplied `node` value here is a candidate, not a declared member, so its NFD form is normalised
    for the ENUM-007 plan-time comparison and passes; the stored bound value itself is not rewritten (normalisation
    is comparison-only), hence expected.value is still the original NFD codepoint sequence. Uses the ''node''
    arg (unconstrained by enum) purely as the vehicle for a deterministic Unicode-bearing plan-time literal;
    the enum-relevant assertion is that plan validation does not raise ENUM-007 for this scenario.'
- id: TV-ENUM-UNICODE-002
  category: ENUM-UNICODE
  description: 'Invalid-UTF-8 enum members (ENUM-005) cannot be represented in this YAML/JSON corpus:
    the file itself must be valid UTF-8 to load. Pinned as a contract-level placeholder.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod", "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    value: prod
  note: 'UNSUPPORTED-UNDER-CORPUS-FORMAT: ENUM-005''s ''invalid UTF-8'' clause has no vector-representable
    witness -- design/yawr/conformance/vector.schema.json vectors are YAML/JSON text, and both YAML and
    JSON require the document to be well-formed Unicode text before any parser sees it; an invalid byte
    sequence would fail file decoding before enum well-formedness checks ever run. This vector is a deterministic
    placeholder pinning that fact rather than inventing a raw-bytes field the schema does not define.
    A conformance harness implementer MUST instead exercise this condition, if desired, via a unit test
    that feeds raw non-UTF-8 bytes directly to the declaration parser -- outside this corpus format.'
  tags:
  - untestable-in-corpus-format
- id: TV-ENUM-UNICODE-003
  category: ENUM-UNICODE
  description: An enum member containing a bidi/format control character (U+202E RIGHT-TO-LEFT OVERRIDE)
    is ENUM-005.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod‮", "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-005
  note: 'AR-ENUM-3(7)/AR-ENUM-4: bidi/format controls U+200E, U+200F, U+202A-U+202E, U+2066-U+2069 are
    rejected.'
- id: TV-ENUM-UNICODE-004
  category: ENUM-UNICODE
  description: An enum member containing a Unicode control character (U+0007 BEL, a C0 control) is ENUM-005.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          enum: ["prod\a", "stage"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error_class: ENUM
    error_code: ENUM-005
  note: 'AR-ENUM-3(7): control characters U+0000-U+001F and U+007F are rejected.'
- id: TV-ENUM-UNICODE-005
  category: ENUM-UNICODE
  description: 'A combining-acute candidate (''a''+U+0301) NFC-normalises to the precomposed form and
    matches the declared member: combining and precomposed forms are the same member.'
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      requires:
        - package: acme.enum-tools
          version: "^1.0.0"
          path: ./vendor/acme-enum-tools
      toolRefs:
        - name: kubectl
          package: acme.enum-tools
      flow:
        - step:
            id: drain
            type: tool
            tool:
              name: kubectl
              action: drain-node
              args:
                node: node-1
                strategy: "a\u0301"
            capture:
              drained: outputs.drained
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    vendor/acme-enum-tools/yawr-package.yaml: |
      apiVersion: yawr.tool-package/v1
      meta:
        name: acme.enum-tools
        version: "1.0.0"
      exports:
        tools:
          - id: kubectl
            path: tools/kubectl.tool.yaml
    vendor/acme-enum-tools/tools/kubectl.tool.yaml: |+
      apiVersion: yawr.tool/v1
      meta:
        name: kubectl
        version: "1.0.0"
      transport:
        mode: stdio
      governance:
        allowed-modes: ["real"]
        requires-approval: true
      actions:
        - name: get-nodes
          argv: ["get", "nodes"]
          args: {}
        - name: drain-node
          execute:
            kind: runbook
            path: ../runbooks/drain-node.yaml
          args:
            node: {type: string, required: true}
            strategy:
              type: string
              required: false
              default: graceful
              enum: ["\u00e1", "force"]

          outputs:
            drained: {type: boolean}

    vendor/acme-enum-tools/runbooks/drain-node.yaml: |
      apiVersion: yawr.runbook/v1
      id: acme.enum-tools/drain-node
      name: drain-node
      inputs:
        node: {type: string, required: true, from: context}
        strategy:
          type: string
          required: false
          from: context
          default: graceful
          enum: ["\u00e1", "force"]
      outputs:
        drained: {type: boolean, value: "step.drain.json.drained"}

      flow:
        - step:
            id: drain
            type: cli
            command: bash
            args: ["-c", "echo '{\"drained\": true}'"]
            capture:
              drain: json
  expected:
    value: á
  note: 'AR-ENUM-4: comparison is codepoint-wise equality on NFC forms; the candidate ''a\u0301'' NFC-normalises
    to ''\u00e1'' and matches the declared member exactly, so binding succeeds (no ENUM-008). The stored
    value is the original candidate (''a\u0301''); normalisation is comparison-only.'
- id: TV-ENUM-UNICODE-006
  category: ENUM-UNICODE
  description: Case-only-distinct members after NFC ('Café'/'café') are legal, match case-sensitively,
    and MUST emit ENUM-W001.
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      inputs:
        env_name:
          type: string
          required: false
          default: "café"
          enum: ["Caf\u00e9", "café"]

      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    value: café
    warnings:
    - ENUM-W001
  note: 'AR-ENUM-4: case-only-distinct pairs are evaluated on their NFC forms, same rule as the ASCII
    case (ENUM-DECL-013).'
- id: TV-ENUM-UNICODE-007
  category: ENUM-UNICODE
  description: Canonical order (used for deterministic diagnostics/cross-runtime parity) is ascending
    codepoint order of NFC member forms, independent of declared order.
  input: runbook.yaml
  variables:
    runbook.yaml: |
