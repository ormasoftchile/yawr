    category: GXL-PARSE
    description: "Parser accepts logical 'not' as a unary prefix operator."
    input: "not is_blocked"
    variables: {}
    expected:
      value: "parse_ok"
    tags: [operator, logical, not]

  # ---------------------------------------------------------------
  # Operator Precedence
  # gxl.ebnf §3 precedence table (comment block before Expression rule)
  # These vectors pin the PARSE-time binding — they do not evaluate.
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-043
    category: GXL-PARSE
    description: "Parser accepts 'not a and b'; 'not' binds tighter than 'and', so this is (not a) and b."
    input: "not a and b"
    variables: {}
    expected:
      value: "parse_ok"
    note: "Precedence level 3 (not) > level 2 (and). Evaluation of (not a) and b is in TV-GXL-EVAL. gxl.ebnf §3."
    tags: [precedence, not, and]

  - id: TV-GXL-PARSE-044
    category: GXL-PARSE
    description: "Parser accepts 'a or b and c'; 'and' binds tighter than 'or', so this is a or (b and c)."
    input: "a or b and c"
    variables: {}
    expected:
      value: "parse_ok"
    note: "Precedence level 1 (or) < level 2 (and). Evaluation witness in TV-GXL-EVAL. gxl.ebnf §3."
    tags: [precedence, or, and]

  - id: TV-GXL-PARSE-045
    category: GXL-PARSE
    description: "Parser accepts 'a + b * c'; '*' binds tighter than '+', so this is a + (b * c)."
    input: "a + b * c"
    variables: {}
    expected:
      value: "parse_ok"
    note: "Precedence level 5 (+) < level 6 (*). gxl.ebnf §3."
    tags: [precedence, arithmetic]

  - id: TV-GXL-PARSE-046
    category: GXL-PARSE
    description: "Parser accepts a parenthesized sub-expression that overrides default precedence."
    input: "(a + b) * c"
    variables: {}
    expected:
      value: "parse_ok"
    note: "LPAREN overrides the default * > + precedence. gxl.ebnf §3 Primary → LPAREN Expression RPAREN."
    tags: [precedence, parentheses]

