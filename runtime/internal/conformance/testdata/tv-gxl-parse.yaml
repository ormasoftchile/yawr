    tags: [function-call, nested, len, str]

  - id: TV-GXL-PARSE-053
    category: GXL-PARSE
    description: "Parser accepts a GDP path as an argument to a namespace function call."
    input: "str.startsWith(config.prefix, \"prod\")"
    variables: {}
    expected:
      value: "parse_ok"
    note: "Covers OI-GXL-05: GDP path in function argument position. gxl.ebnf §6 OI-GXL-05."
    tags: [function-call, gdp, nested, OI-GXL-05]

  # ---------------------------------------------------------------
  # Short-Circuit Witness (OQ1)
  # gxl.ebnf §5.1; .squad/decisions/inbox/copilot-directive-gxl-oq1-oq2-ratification.md
  # Parse must accept 'false and X' regardless of what X resolves to.
  # Semantic short-circuit behaviour is tested in TV-GXL-EVAL.
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-054
    category: GXL-PARSE
    description: "Parser accepts 'false and missingVar'; short-circuit parse form must be syntactically valid."
    input: "false and missingVar"
    variables: {}
    expected:
      value: "parse_ok"
    note: "OQ1 ratified: 'false and X' short-circuits — X is not evaluated. Parser MUST accept this form. Evaluation witness (short-circuit prevents path error) is TV-GXL-EVAL. gxl.ebnf §5.1."
    tags: [short-circuit, OQ1, and]

  - id: TV-GXL-PARSE-055
    category: GXL-PARSE
    description: "Parser accepts 'true or missingVar'; short-circuit parse form must be syntactically valid."
    input: "true or missingVar"
    variables: {}
    expected:
      value: "parse_ok"
    note: "OQ1 ratified: 'true or X' short-circuits — X is not evaluated. Parser MUST accept this form. gxl.ebnf §5.1."
    tags: [short-circuit, OQ1, or]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-001: Unexpected token
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-056
    category: GXL-PARSE
    description: "Parser rejects a bare leading-dot path (.foo) — DOT is not a valid Primary start."
    input: ".foo"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-001
    note: "GDP production requires a leading IDENT, not DOT. gxl.ebnf §3 GDP."
    tags: [negative, unexpected-token]

  - id: TV-GXL-PARSE-057
    category: GXL-PARSE
    description: "Parser rejects a trailing operator with no right-hand operand."
    input: "a +"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-001
    note: "Addition rule requires a Multiply on the right; EOF is unexpected. gxl.ebnf §3 Addition."
    tags: [negative, unexpected-token]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-002: Unterminated string literal
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-058
    category: GXL-PARSE
    description: "Parser rejects a double-quoted string that is never closed before EOF."
    input: '"unterminated'
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-002
    note: "gxl.ebnf §2.4: EOF before closing quote → GXL-PARSE-002."
    tags: [negative, string, unterminated]

  - id: TV-GXL-PARSE-059
    category: GXL-PARSE
    description: "Parser rejects a single-quoted string that is never closed before EOF."
    input: "'unterminated"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-002
    tags: [negative, string, unterminated, single-quote]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-003: Invalid number literal
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-060
    category: GXL-PARSE
    description: "Parser rejects an integer literal with leading zeros (007)."
    input: "007"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-003
    note: "gxl.ebnf §2.5 explicitly states: '007 is a parse error: GXL-PARSE-003'. INTEGER = '0' | ('1'..'9' {'0'..'9'}); '007' is not in this grammar."
    tags: [negative, number, leading-zero]

  - id: TV-GXL-PARSE-061
    category: GXL-PARSE
    description: "Parser rejects a number with two decimal points (1.2.3) — invalid numeric token."
    input: "1.2.3"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-001
    note: "expected_status: undecided — see .squad/decisions/inbox/tess-stream-c-day1-schema-and-parse.md. Lexer tokenises '1.2' as NUMBER then '.' as DOT then '3' as NUMBER; parse fails on unexpected DOT after Primary. Could be GXL-PARSE-003 if lexer tries whole-token analysis. Barbara to decide."
    tags: [negative, number, invalid, ambiguous]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-004: Invalid escape sequence
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-062
    category: GXL-PARSE
    description: "Parser rejects a string containing an unrecognized escape sequence (\\q)."
    input: '"hello \q world"'
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-004
    note: "gxl.ebnf §2.4 ESCAPE_BODY: 'Any other character after backslash is error GXL-PARSE-004'."
    tags: [negative, string, escape, invalid]

  - id: TV-GXL-PARSE-063
    category: GXL-PARSE
    description: "Parser rejects a string with a \\x hex escape (recognized in many languages but not in GXL)."
    input: '"hex \xFF"'
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-004
    note: "GXL uses \\uXXXX and \\UXXXXXXXX for Unicode; \\x is not in ESCAPE_BODY. gxl.ebnf §2.4."
    tags: [negative, string, escape, invalid]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-005: Unknown namespace
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-064
    category: GXL-PARSE
    description: "Parser rejects a call to the 'math' namespace (reserved for v2, no methods in v1)."
    input: "math.abs(x)"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-005
    note: "gxl.ebnf §4.5: 'Referencing math.* → GXL-PARSE-005'. KW_MATH is reserved but not usable in v1."
    tags: [negative, namespace, math, reserved]

  - id: TV-GXL-PARSE-065
    category: GXL-PARSE
    description: "Parser rejects a call to a completely unknown namespace prefix."
    input: "http.get(url)"
    variables: {}
    expected:
      error_class: GXL-PARSE
      error_code: GXL-PARSE-005
    note: "Namespace allowlist is str, list, regex only. 'http' is not reserved but also not allowed. gxl.ebnf §3 Namespace."
    tags: [negative, namespace, unknown]

  # ---------------------------------------------------------------
  # Negative Parse Vectors — GXL-PARSE-006: Unknown namespace method
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-066
    category: GXL-PARSE
    description: "Parser rejects a call to an unknown method on the 'str' namespace (str.explode)."
    input: "str.explode(s, \",\")"
    variables: {}
    expected:
