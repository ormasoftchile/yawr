# tv-gxl-parse.yaml
# Category:    GXL-PARSE
# Grammar ref: spec/grammar/gxl.ebnf
# Schema ref:  design/yawr/conformance/vector.schema.json
# Author:      Tess (Conformance Tester)
# Date:        2026-06-05T00:14:04-04:00
#
# Purpose: Pin down every grammar production in gxl.ebnf that is
# observable at PARSE time (lexer + syntactic grammar). Evaluation
# semantics (type errors, path resolution, short-circuit behaviour)
# are deferred to tv-gxl-eval.yaml.
#
# Convention for positive vectors:
#   expected.value: "parse_ok"
#   The AST shape is implementation-defined; conforming runtimes
#   MUST accept the expression without error.
#
# Convention for negative vectors:
#   expected.error_class + expected.error_code match gxl.ebnf §6.1.
#
# Open issues raised to Barbara:
#   See .squad/decisions/inbox/tess-stream-c-day1-schema-and-parse.md
#   §Ambiguities for GXL-PARSE-010-vs-007 and 1.2.3 classification.

vectors:

  # ---------------------------------------------------------------
  # Literals — INTEGER
  # gxl.ebnf §2.5, §3 Literal → NUMBER → INTEGER
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-001
    category: GXL-PARSE
    description: "Parser accepts a simple decimal integer literal."
    input: "42"
    variables: {}
    expected:
      value: "parse_ok"
    tags: [literal, integer]

  - id: TV-GXL-PARSE-002
    category: GXL-PARSE
    description: "Parser accepts zero as a standalone integer literal (single-digit form)."
    input: "0"
    variables: {}
    expected:
      value: "parse_ok"
    tags: [literal, integer, edge]

  - id: TV-GXL-PARSE-003
    category: GXL-PARSE
    description: "Parser accepts a negative integer produced by UnaryMinus applied to NUMBER."
    input: "-7"
    variables: {}
    expected:
      value: "parse_ok"
    note: "Negative numbers are NOT lexer tokens; '-7' is UnaryMinus(NUMBER('7')). See gxl.ebnf §2.5."
    tags: [literal, integer, unary-minus]

  # ---------------------------------------------------------------
  # Literals — FLOAT / SCIENTIFIC
  # gxl.ebnf §2.5 NUMBER = INTEGER [ FRAC ] [ EXP ]
  # ---------------------------------------------------------------

  - id: TV-GXL-PARSE-004
