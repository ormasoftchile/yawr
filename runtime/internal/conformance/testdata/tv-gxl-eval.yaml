  - id: TV-GXL-EVAL-063
    category: GXL-EVAL
    description: 'str.endsWith("hello", "lo") returns true.'
    input: 'str.endsWith("hello", "lo")'
    variables: {}
    expected:
      value: true
    tags: [stdlib, str, endsWith]

  - id: TV-GXL-EVAL-064
    category: GXL-EVAL
    description: 'str.endsWith("hello", "he") returns false.'
    input: 'str.endsWith("hello", "he")'
    variables: {}
    expected:
      value: false
    tags: [stdlib, str, endsWith]

  - id: TV-GXL-EVAL-065
    category: GXL-EVAL
    description: 'str.endsWith("world", "") returns true — empty suffix always matches.'
    input: 'str.endsWith("world", "")'
    variables: {}
