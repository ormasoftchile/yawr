    expected:
      value: true
    tags: [stdlib, str, startsWith]

  - id: TV-GXL-EVAL-061
    category: GXL-EVAL
    description: 'str.startsWith("hello", "lo") returns false.'
    input: 'str.startsWith("hello", "lo")'
    variables: {}
    expected:
      value: false
    tags: [stdlib, str, startsWith]

  - id: TV-GXL-EVAL-062
    category: GXL-EVAL
    description: 'str.startsWith("", "") returns true — empty prefix always matches.'
    input: 'str.startsWith("", "")'
    variables: {}
    expected:
      value: true
    note: "gxl.ebnf §4.2: 'Empty prefix → always true'."
