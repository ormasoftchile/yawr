# Tool Packages conformance corpus (AR-TP-1..13, gate reviews 1-3 APPROVED).
# Generated by design/yawr/scripts/gen_pkg_vectors.py (scaffolding, safe to
# delete once this file is reviewed/stable). Vectors model a synthetic
# workspace filesystem as a flat map from workspace-relative POSIX path to
# file content string, per the shape used by the other tv-*.yaml corpora.
#
# Modeling extensions used beyond plain file-content strings (flagged for
# reviewer awareness; not literal schema fields, evaluated by convention):
#   - 'builtins': [name, ...]        — tier-0 built-in registry contents.
#   - 'extensions': ["srv/tool", ...] — tier-3 extension/MCP registrations.
#   - 'symlinks': {path: target}     — POSIX symlink, evaluated against the
#     same flat filesystem map (path resolves through target).
#   - 'reparse_points': {path: target} — NTFS junction/reparse point,
#     evaluated identically to 'symlinks'.
#
# Categories: PKG-VERSION, PKG-RESOLVE, PKG-COLLIDE, PKG-PATH, PKG-SUBST,
# PKG-DIGEST, PKG-ERROR. Every reachable PKG-001..030 (PKG-019 reserved),
# PLAN-010, and PKG-W001..W003 is exercised at least once; see the session
# summary in .squad/agents/tess/history.md for the coverage matrix.
vectors:
- id: TV-PKG-VERSION-001
  category: PKG-VERSION
  description: Caret constraint ^1.4.2 is satisfied by a package version inside its upper-exclusive bound
    (>=1.4.2 <2.0.0).
  input: runbook.yaml
  variables:
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      requires:
        - package: acme.incident-tools
          version: "^1.4.2"
          path: ./vendor/acme-incident-tools
      toolRefs:
        - name: kubectl
          package: acme.incident-tools
      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    vendor/acme-incident-tools/yawr-package.yaml: |
      apiVersion: yawr.tool-package/v1
      meta:
        name: acme.incident-tools
        version: "1.9.9"
      exports:
        tools:
          - id: kubectl
            path: tools/kubectl.tool.yaml
    vendor/acme-incident-tools/tools/kubectl.tool.yaml: |
      apiVersion: yawr.tool/v1
      meta:
        name: kubectl
        version: "1.0.0"
      transport:
        mode: stdio
      governance:
        allowed-environments: ["real"]
        requires-approval: true
      actions:
        - name: noop
          argv: ["version"]
          args: {}
  expected:
    catalog:
      kubectl:
        qualifiedName: acme.incident-tools/kubectl
        tier: 1
        resolvedVersion: 1.9.9
  tags:
  - AR-TP-4
