            else: skip
        - step:
            id: drain
            type: cli
            command: bash
            args: ["-c", "echo '{\"drained\": true}'"]
            capture:
              drain: json
            next: set_drained
        - step:
            id: skip
            type: end
            outcome: {category: success, code: skipped}
        - step:
            id: set_drained
            type: end
            outcome: {category: success, code: node_drained}
  expected:
    error:
      code: PKG-027
  note: The 'skip' terminal branch reaches an 'end' step without ever executing the 'drain' step whose
    capture assigns the value the runbook-level outputs.drained declaration reads from (step.drain.json.drained)
    — that path never produces 'drained', which is the PKG-027 condition. own 'end' step without ever
    assigning the declared output — is PKG-027 (declared substitute output not produced on all terminal
    paths), checked statically at plan time.
- id: TV-PKG-ERROR-010
  category: PKG-ERROR
  description: A step.tool.name reference resolving to a catalog entry that exists ONLY because a DIFFERENT
    runbook file in the same workspace declares a matching toolRefs entry — the declaring file itself
    has...
  input: runbook.yaml
  variables:
    other.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      toolRefs:
        - name: kubectl
          path: ./tools/kubectl.tool.yaml
      flow:
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
    tools/kubectl.tool.yaml: |
      apiVersion: yawr.tool/v1
      meta:
        name: kubectl
        version: "1.0.0"
      transport:
        mode: stdio
      governance:
        allowed-environments: ["real"]
        requires-approval: true
      actions:
        - name: noop
          argv: ["version"]
          args: {}
    runbook.yaml: |
      apiVersion: yawr.runbook/v1
      id: r
      name: r
      flow:
        - step:
            id: use
            type: tool
            tool:
              name: kubectl
              action: noop
              args: {}
            capture:
              r: exit_code
        - step:
            id: end
            type: end
            outcome: {category: success, code: ok}
  expected:
    error:
      code: PLAN-010
  note: '''other.yaml'' is never included by ''runbook.yaml'' in this vector; it exists purely to demonstrate
    that even IF a same-named toolRefs entry is declared somewhere else in the workspace, it has zero
    effect on ''runbook.yaml'', which has no toolRefs of its own for ''kubectl'' — design/yawr/sections/02-architecture.tex
    §Lexical Tool-Name Scoping. no toolRefs binding for that name — is PLAN-010: tool-name binding is
    lexically scoped strictly per declaring file, never inherited across files (even sibling/included
    ones).'
