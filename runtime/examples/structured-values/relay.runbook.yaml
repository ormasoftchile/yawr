apiVersion: yawr.runbook/v1
id: relay
name: Re-export another substituted tool's captured structured outputs
outputs:
  records: {type: array, value_expr: captured_records}
  labels: {type: array, value_expr: captured_labels}
flow:
  - step:
      id: gather
      type: tool
      tool:
        name: records
        action: gather
        args:
          configurations:
            - {id: alpha, count: 2}
            - {id: beta, count: 1}
            - {id: missing, count: 0}
            - {id: empty, count: 0}
      capture:
        captured_records: outputs.records
        captured_labels: outputs.labels
