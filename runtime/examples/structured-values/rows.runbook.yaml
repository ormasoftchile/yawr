apiVersion: yawr.runbook/v1
id: rows
name: Generate typed example rows without external operations
inputs:
  name: {type: string, required: true}
  count: {type: string, required: true}
outputs:
  rows: {type: array, value_expr: collected_rows}
  status: {type: string, value_expr: query_status, enum: [observed, no-data, failed]}
flow:
  - step:
      id: classify
      type: branch
      branches:
        - condition: 'name == "failed"'
          steps:
            - step: {id: failed, type: noop, capture: {query_status: failed}}
        - condition: 'count == "0"'
          steps:
            - step: {id: empty, type: noop, capture: {query_status: no-data}}
        - condition: "true"
          steps:
            - step: {id: observed, type: noop, capture: {query_status: observed}}
  - iterate:
      id: rows
      over: '${count}'
      max: 3
      steps:
        - step: {id: row_operation, type: noop}
      collect_values:
        collected_rows:
          name: '${name}'
          index: '${iteration}'
          active: true
          metadata: {weight: 2.5, note: null}
          tags: [example, '${name}']
  - step:
      id: query_failure
      type: assert
      assert:
        - {type: eq, subject: '${name != "failed"}', expected: "true"}
