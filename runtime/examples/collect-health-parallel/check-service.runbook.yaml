# Child runbook: checks a single service and captures its status.
# Called by collect-health-parallel.runbook.yaml via include.
apiVersion: yawr.runbook/v1

id: check-service
name: check-service
kind: reference
description: Check a single service endpoint and capture health status

toolRefs:
  - name: curl
    path: ../../tools/curl.tool.yaml

flow:
  - step:
      id: ping_service
      type: tool
      title: "Health check ${service_host}"
      delay: 2s
      continue_on_fail: true
      tool:
        name: curl
        action: head
        args:
          url: "https://${service_host}/"
      capture:
        health_response: stdout
        exit_code: exit_code

  - step:
      id: summarize_host
      type: noop
      title: "Summarize ${service_host}"
      capture:
        checked_host: "${service_host}"

  - step:
      id: summarize_status
      type: branch
      branches:
        - condition: 'str.contains(health_response, "200")'
          label: Service healthy
          steps:
            - step:
                id: status_healthy
                type: noop
                title: "${service_host} is healthy"
                capture:
                  service_status: healthy

        - condition: 'not str.contains(health_response, "200")'
          label: Service degraded
          steps:
            - step:
                id: status_degraded
                type: noop
                title: "${service_host} is degraded"
                capture:
                  service_status: degraded
