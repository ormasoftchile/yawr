apiVersion: yawr.runbook/v1
id: graph-operator
name: Operator classification
flow:
  - step:
      id: review
      type: include
      include:
        runbook: classify.runbook.yaml
  - step:
      id: operator_classification
      type: choice
      title: Operator GEODR classification
      prompt: This is local sample data only. Classify the evidence to let the parent continue.
      variable: classification
      options:
        - {value: healthy, label: Healthy}
        - {value: geodr, label: GEODR investigation required}
  - step: {id: classification_recorded, type: noop}
