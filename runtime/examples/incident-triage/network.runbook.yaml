# Incident Triage — Network Investigation (Child)
# Invoked by incident-triage.runbook.yaml for network-category incidents.
# Contains its own branching and includes connectivity-test as a grandchild.
#
# Demonstrates: child-level branching, choice steps, nested include, tool steps.
#
# ⚠️  KNOWN LIMITATION: The when: fields in this example are parsed but
# not yet evaluated at runtime (DEF-004). All steps currently execute
# unconditionally. For conditional execution, use branch steps with
# condition: arms. See the dynamic-include contract §9 (B-19).
apiVersion: yawr.runbook/v1

id: incident-triage.network
name: incident-triage.network
kind: mitigation
description: >
  Investigate network-related incidents. Determines whether the issue is
  DNS, connectivity, or firewall related and routes to the appropriate
  diagnostic procedure.

toolRefs:
  - name: nslookup
    path: ../../tools/nslookup.tool.yaml

imports:
  connectivity_test: connectivity-test.runbook.yaml

inputs:
  service_name:
    type: string
    required: false
    description: Affected service name
    from: prompt
  incident_id:
    type: string
    required: false
    description: Incident tracking ID
    from: prompt

flow:
  # ──────────────────────────────────────────────
  # Step 1: Determine network layer
  # ──────────────────────────────────────────────
  - step:
      id: determine_network_layer
      type: choice
      title: Determine the network issue layer
      prompt: |
        For ${service_name}, determine the network layer affected:

        - DNS: nslookup fails, NXDOMAIN, stale records
        - Connectivity: TCP timeouts, packet loss, route changes
        - Firewall: connection refused, blocked ports, security group changes

        Check monitoring dashboards and recent change logs.
      variable: network_layer
      options:
        - value: "dns"
          label: "DNS — resolution failures or stale records"
        - value: "connectivity"
          label: "Connectivity — reachability, latency, or packet loss"
        - value: "firewall"
          label: "Firewall — blocked connections or port restrictions"
        - value: "unclear"
          label: "Unclear — need deeper investigation"

  # ──────────────────────────────────────────────
  # Connectivity path: choice to run automated diagnostics (nested include)
  # ──────────────────────────────────────────────
  - step:
      id: try_connectivity_test
      type: choice
      when: 'network_layer == "connectivity"'
      title: Consider running connectivity diagnostics
      prompt: |
        Before manual investigation, we can run automated connectivity
        diagnostics that test ping, HTTP, and route paths.
      variable: run_diag
      options:
        - value: "yes"
          label: "Yes — run connectivity test procedure"
        - value: "no"
          label: "No — investigate manually"

  - step:
      id: branch_diag
      type: branch
      when: 'network_layer == "connectivity"'
      branches:
        - condition: 'run_diag == "yes"'
          label: Automated diagnostics
          steps:
            - step:
                id: invoke_connectivity
                type: include
                title: Run connectivity test procedure
                include:
                  runbook: connectivity-test.runbook.yaml
                  with:
                    service_name: "${service_name}"
                    incident_id: "${incident_id}"
                  gate:
                    # Once connectivity-test reaches a terminator (any
                    # of its end-steps: connectivity restored, app-layer
                    # failure, isolated/regional/global outage), there
                    # is nothing left to investigate at the network
                    # layer. Stop on both resolved AND escalated so the
                    # parent flow does not continue into dns_check /
                    # firewall_check after a terminator.
                    stop_if: [resolved, escalated]

        - condition: 'run_diag == "no"'
          label: Manual investigation
          steps:
            - step:
                id: manual_connectivity
                type: collector
                title: Manual connectivity investigation
                prompt: |
                  Check the following for ${service_name}:
                  1. traceroute from multiple regions
                  2. Packet loss rates over last hour
                  3. Recent network change deployments
                  4. BGP route changes
                fields:
                  - name: connectivity_notes
                    type: text
                    label: Connectivity notes
                    required: true
                    multiline: true
                required_evidence:
                  - kind: text
                    name: connectivity_notes

            - step:
                id: manual_conn_done
                type: end
                title: Manual connectivity investigation complete
                outcome:
                  category: escalated
                  code: connectivity_manual

  # ──────────────────────────────────────────────
  # DNS path: tool check with branching
  # ──────────────────────────────────────────────
  - step:
      id: dns_check
      type: tool
      when: 'network_layer == "dns"'
      title: DNS resolution check
      tool:
        name: nslookup
        action: lookup
        args:
          name: "${service_name}"
      capture:
        dns_result: stdout

  - step:
      id: branch_dns
      type: branch
      when: 'network_layer == "dns"'
      branches:
        - condition: 'str.contains(dns_result, "Address")'
          label: DNS resolves
          steps:
            - step:
                id: dns_stale
                type: collector
                title: DNS resolves but may be stale
                prompt: |
                  DNS resolved for ${service_name}: ${dns_result}
                  Verify the IP matches the expected endpoint.
                  Check TTL and propagation across regions.
                fields:
                  - name: dns_notes
                    type: text
                    label: DNS verification notes
                    required: false
                    multiline: true

            - step:
                id: dns_ok
                type: end
                title: DNS verified
                outcome:
                  category: resolved
                  code: dns_verified

        - condition: 'not str.contains(dns_result, "Address")'
          label: DNS failure
          steps:
            - step:
                id: dns_failed
                type: collector
                title: DNS resolution failed
                prompt: |
                  DNS failed for ${service_name}.
                  Result: ${dns_result}

                  Check:
                  1. DNS zone records
                  2. Recent DNS changes
                  3. DNS provider status page
                fields:
                  - name: dns_investigation
                    type: text
                    label: DNS investigation notes
                    required: true
                    multiline: true
                required_evidence:
                  - kind: text
                    name: dns_investigation

            - step:
                id: dns_escalate
                type: end
                title: DNS failure — escalated
                outcome:
                  category: escalated
                  code: dns_failure

  # ──────────────────────────────────────────────
  # Firewall path: manual investigation
  # ──────────────────────────────────────────────
  - step:
      id: firewall_check
      type: collector
      when: 'network_layer == "firewall"'
      title: Firewall rule investigation
      prompt: |
        For ${service_name}, investigate firewall rules:
        1. Check recent security group / ACL changes
        2. Verify required ports are open
        3. Check for IP allowlist changes
        4. Review firewall logs for blocked traffic
      fields:
        - name: firewall_notes
          type: text
          label: Firewall investigation notes
          required: false
          multiline: true
      required_evidence:
        - kind: checklist
          name: firewall_checklist
          items:
            - "Security group rules reviewed"
            - "Required ports verified open"
            - "Firewall logs checked for blocked traffic"

  - step:
      id: firewall_done
      type: end
      when: 'network_layer == "firewall"'
      title: Firewall investigation complete
      outcome:
        category: escalated
        code: firewall_review

  # ──────────────────────────────────────────────
  # Unclear path: escalate immediately
  # ──────────────────────────────────────────────
  - step:
      id: unclear_escalate
      type: end
      when: 'network_layer == "unclear"'
      title: Network layer unclear — escalate
      outcome:
        category: escalated
        code: network_unclear
