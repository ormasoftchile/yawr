apiVersion: yawr.tool/v1
meta: {name: code, version: "1.0.0"}
transport: {mode: native, command: must-not-execute}
actions:
  - name: sql
    classification: read-only
    args:
      text:
        type: string
        required: true
        presentation: {version: 1, kind: code, language: sql}
    outputs:
      code:
        type: string
        presentation: {version: 1, kind: code, language: sql}
    execute: {kind: runbook, path: echo.runbook.yaml}
  - name: kql
    classification: read-only
    args:
      text:
        type: string
        required: true
        presentation: {version: 1, kind: code, language: kql}
    outputs:
      code:
        type: string
        presentation: {version: 1, kind: code, language: kql}
    execute: {kind: runbook, path: echo.runbook.yaml}
  - name: powershell
    classification: read-only
    args:
      text:
        type: string
        required: true
        presentation: {version: 1, kind: code, language: powershell}
    outputs:
      code:
        type: string
        presentation: {version: 1, kind: code, language: powershell}
    execute: {kind: runbook, path: echo.runbook.yaml}
