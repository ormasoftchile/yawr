apiVersion: yawr.runbook/v1
id: reject-parent-private-alias
name: Reject inherited private aliases before any tool executes
requires:
  - {package: scope.left, version: "^1.0.0", path: ../catalog/tools/left}
toolRefs:
  - {name: query, package: scope.left}
flow:
  - step:
      id: must_not_dispatch
      type: tool
      tool: {name: query, action: read}
  - step:
      id: enter_child
      type: include
      include: {runbook: private-alias-child.runbook.yaml}
