apiVersion: yawr.runbook/v1
id: scoped-tool-router
name: Frozen tool body with dynamic includes
requires:
  - {package: scope-children, version: "^1.0.0"}
flow:
  - step:
      id: enter_left
      type: include
      include: {runbook_ref: scope-children/left, resolve_from: catalog}
  - step:
      id: enter_right
      type: include
      include: {runbook_ref: scope-children/right, resolve_from: catalog}
