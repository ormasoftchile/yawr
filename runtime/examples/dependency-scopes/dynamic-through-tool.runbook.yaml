apiVersion: yawr.runbook/v1
id: lexical-dynamic-through-tool
name: A tool-backed runbook dynamically opens scoped children
outputs:
  scenario: {type: string, value: lexical-dynamic-through-tool}
requires:
  - {package: scope-children, version: "^1.0.0", path: catalog}
  - {package: scope-router, version: "^1.0.0", path: router}
toolRefs:
  - {name: router, package: scope-router}
flow:
  - step:
      id: route
      type: tool
      tool: {name: router, action: investigate}
  - step: {id: returned_from_tool, type: noop}
  - step: {id: results, type: results, title: Results}
