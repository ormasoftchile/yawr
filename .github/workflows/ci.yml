name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  root-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Verify Yawr root wiring
        run: node scripts/verify-root-wiring.mjs

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: runtime/go.sum
      - name: Build Yawr command
        run: go build -trimpath -buildvcs=false -o "${{ runner.temp }}/yawr" ./cmd/yawr
      - name: Test runtime
        run: go test ./... -count=1

  extension-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      YAWR_CORE_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - name: Build and export current expression helper
        shell: pwsh
        run: |
          $executable = if ($IsWindows) { 'yawr-expression.exe' } else { 'yawr-expression' }
          $helper = Join-Path $env:RUNNER_TEMP $executable
          go build -C runtime -trimpath -buildvcs=false -o $helper ./cmd/yawr
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "Current-source expression helper was not built at $helper"
          }
          $identity = go version -m $helper 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $identity -notmatch 'path\s+github\.com/ormasoftchile/yawr/runtime/cmd/yawr') {
            throw "Built expression helper identity is invalid: $identity"
          }
          "YAWR_EXPRESSION_HELPER=$helper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run complete retained unit suite
        run: npm run extension:test

  extension-cross-repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Isolate canonical core fixture
        shell: bash
        run: |
          fixture=internal/serve/testdata/host_action_wire_v1.json
          mkdir -p "$RUNNER_TEMP/runtime-copy/$(dirname "$fixture")"
          cp "runtime/$fixture" "$RUNNER_TEMP/runtime-copy/$fixture"
          rm "runtime/$fixture"
      - name: Verify runtime-extension wire contract
        env:
          YAWR_CORE_ROOT: ${{ runner.temp }}/runtime-copy
        run: npm run extension:test:cross-repo

  extension-authoring-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      YAWR_CORE_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - name: Build production authoring helper (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run:         (cd runtime && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/yawr-authoring" ./cmd/yawr)
      - name: Build production authoring helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'yawr-authoring.exe'
          go build -C runtime -trimpath -buildvcs=false -o $helper ./cmd/yawr
      - name: Run production authoring contract (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          YAWR_AUTHORING_HELPER: ${{ runner.temp }}/yawr-authoring
        run: npm run extension:test:authoring:core
      - name: Run production authoring contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YAWR_AUTHORING_HELPER: ${{ runner.temp }}\yawr-authoring.exe
        run: npm run extension:test:authoring:core

  extension-source-host:
    # The authoritative extension workflow runs Electron E2E on Linux under
    # Xvfb. Keep that supported host instead of claiming unproven OS coverage.
    runs-on: ubuntu-latest
    env:
      YAWR_CORE_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - name: Compile extension for helper packaging
        run: npm run extension:compile
      - name: Build and package matching runtime helper
        shell: bash
        run: |
          (cd runtime && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/yawr-e2e" ./cmd/yawr)
          npm run extension:package-helper -- "$RUNNER_TEMP/yawr-e2e"
          npm run extension:verify-authoring-parity -- "$RUNNER_TEMP/yawr-e2e"
      - name: Run source extension-host tests
        env:
          YAWR_E2E_BINARY: ${{ runner.temp }}/yawr-e2e
        run: xvfb-run -a npm run extension:e2e

  extension-installed-vsix:
    # Installed Electron acceptance follows the authoritative Linux/Xvfb path.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YAWR_CORE_ROOT: ${{ github.workspace }}/runtime
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.25.7'
          cache-dependency-path: runtime/go.sum
      - run: npm ci
      - name: Compile extension for helper packaging
        run: npm run extension:compile
      - name: Build and package matching runtime helper
        shell: bash
        run: |
          (cd runtime && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/yawr-vsix" ./cmd/yawr)
          npm run extension:package-helper -- "$RUNNER_TEMP/yawr-vsix"
          npm run extension:verify-authoring-parity -- "$RUNNER_TEMP/yawr-vsix"
      - name: Validate extension package
        run: npm run extension:package:validate
      - name: Validate the installed VSIX lifecycle
        run: xvfb-run -a npm run extension:validate:vsix
